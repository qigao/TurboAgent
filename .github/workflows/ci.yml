name: TurboAgent CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      salts_release_tag:
        description: Exact published Salts Release Tag to qualify (not Git SHA)
        type: string
        required: true
        default: v2.3.0-rc.17

permissions:
  contents: read
  packages: read

concurrency:
  group: turboagent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-sdk:
    uses: ./.github/workflows/native-sdk-build.yml
    with:
      salts_release_tag: ${{ inputs.salts_release_tag || 'v2.3.0-rc.17' }}
