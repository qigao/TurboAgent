name: Foundation Migration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: turboagent-foundation-migration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SALTS_SDK_VERSION: "1.8.3"
      SALTS_UTILS_SDK_VERSION: "4.1.3"
      CHTTP_SDK_VERSION: "1.1.4"
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Checkout exact TurboAgent head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Configure shared vcpkg binary cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - name: Restore shared re2c binary
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify source identity
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code

      - name: Reject retired foundation contracts
        shell: bash
        run: |
          set -euo pipefail
          roots=(
            CMakeLists.txt CMakeOptions.cmake CMakeUserPresets.json cmake
            runtime_core runtime_data runtime_tools mcp_tools langchain
            coding_tools codex_bridge llm_sandbox tools vendor
          )
          patterns='TurboUtils::|TurboParser::|TurboNet::|TurboHttp::|TURBOUTILS_ROOT|TURBOPARSER_ROOT|TURBONET_ROOT|TURBOHTTP_ROOT|turbo_parser\.h|turbo_(thread|str(_view)?|uuid|fs|vec|deque|error)\.h|(^|[^[:alnum:]_])tstr_t([^[:alnum:]_]|$)|(^|[^[:alnum:]_])turbo_vec_t([^[:alnum:]_]|$)|(^|[^[:alnum:]_])turbo_deque_t([^[:alnum:]_]|$)|(^|[^[:alnum:]_])turbo_uuid_t([^[:alnum:]_]|$)|CoroNet|turbo_agent_runtime_remote_iris|http_client_t|http_response_t|rpc_client_t|[<"]http_client\.h[>"]|[<"]http_common\.h[>"]|turbo_http_|find_package\((TurboUtils|TurboParser|TurboNet|TurboHttp)|find_dependency\((TurboUtils|TurboParser|TurboNet|TurboHttp)'
          mapfile -t files < <(
            find "${roots[@]}" -type f \
              \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \
                 -o -name 'CMakeLists.txt' -o -name '*.cmake' -o -name '*.cmake.in' \
                 -o -name '*.json' \) -print
          )
          test "${#files[@]}" -gt 0
          if grep -nE "$patterns" "${files[@]}"; then
            echo "retired foundation contract remains in active build/source/test code" >&2
            exit 1
          fi

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm
          test -x "$VCPKG_ROOT/vcpkg"
          sudo mkdir -p /opt/salts /opt/salts-utils /opt/chttp /opt/turboagent
          sudo chown -R "$USER":"$USER" /opt/salts /opt/salts-utils /opt/chttp /opt/turboagent
          sudo ln -sfn "$VCPKG_ROOT" /opt/vcpkg

      - name: Restore released native SDK graph
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          packages="$RUNNER_TEMP/turboagent-foundation-native-sdks"
          config="$RUNNER_TEMP/turboagent-foundation-native-sdks.config"
          project="$RUNNER_TEMP/turboagent-foundation-native-sdks.csproj"

          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"

          cat > "$project" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Salts.Native" Version="[$SALTS_SDK_VERSION]" />
              <PackageReference Include="SaltsUtils.Native" Version="[$SALTS_UTILS_SDK_VERSION]" />
              <PackageReference Include="CHttp.Native" Version="[$CHTTP_SDK_VERSION]" />
            </ItemGroup>
          </Project>
          EOF

          dotnet restore "$project" --packages "$packages" --configfile "$config" --no-cache

          salts_root="$packages/salts.native/$SALTS_SDK_VERSION/sdk/linux-x64"
          utils_root="$packages/saltsutils.native/$SALTS_UTILS_SDK_VERSION/sdk/linux-x64"
          chttp_root="$packages/chttp.native/$CHTTP_SDK_VERSION/sdk/linux-x64"

          test -f "$salts_root/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$utils_root/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -f "$chttp_root/lib/cmake/Chttp/ChttpConfig.cmake"
          test -f "$salts_root/lib/libcnet.so.1"

          ln -sfn "$salts_root" /opt/salts/debug
          ln -sfn "$utils_root" /opt/salts-utils/debug
          ln -sfn "$chttp_root" /opt/chttp/debug

          {
            echo "SALTS_ROOT=/opt/salts/debug"
            echo "SALTS_UTILS_ROOT=/opt/salts-utils/debug"
            echo "CHTTP_ROOT=/opt/chttp/debug"
          } >> "$GITHUB_ENV"

      - name: Configure TurboAgent foundation build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build/foundation -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=ON \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed/foundation" \
            -DCMAKE_INSTALL_PREFIX=/opt/turboagent/debug \
            -DCMAKE_PREFIX_PATH="/opt/chttp/debug;/opt/salts-utils/debug;/opt/salts/debug" \
            -DSALTS_ROOT=/opt/salts/debug \
            -DSALTS_UTILS_ROOT=/opt/salts-utils/debug \
            -DCHTTP_ROOT=/opt/chttp/debug \
            -DENABLE_MCP_TOOLS=ON \
            -DENABLE_LANGCHAIN=ON \
            -DENABLE_LLM_SANDBOX=OFF \
            -DENABLE_CODING_TOOLS=ON \
            -DENABLE_CODEX_BRIDGE=ON \
            -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DENABLE_ASAN=OFF
          grep -F 'ENABLE_MCP_TOOLS:BOOL=ON' build/foundation/CMakeCache.txt
          grep -F 'ENABLE_LANGCHAIN:BOOL=ON' build/foundation/CMakeCache.txt
          grep -F 'ENABLE_LLM_SANDBOX:BOOL=OFF' build/foundation/CMakeCache.txt

      - name: Build and test foundation modules
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/foundation -j2
          vcpkg_libs="$(find "$GITHUB_WORKSPACE/vcpkg_installed/foundation" -type d \
            \( -path '*/x64-linux/debug/lib' -o -path '*/x64-linux/lib' \) -print | paste -sd: -)"
          export LD_LIBRARY_PATH="/opt/chttp/debug/lib:/opt/salts-utils/debug/lib:/opt/salts/debug/lib:$vcpkg_libs:${LD_LIBRARY_PATH:-}"
          test -f /opt/salts/debug/lib/libcnet.so.1
          ctest --test-dir build/foundation --no-tests=error --output-on-failure

      - name: Install TurboAgent
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/foundation --target install -j2
          config=/opt/turboagent/debug/lib/cmake/TurboAgent/TurboAgentConfig.cmake
          test -f "$config"
          test -f /opt/turboagent/debug/lib/cmake/TurboAgent/TurboAgentTargets.cmake
          grep -F 'find_dependency(Salts 1.8.3 EXACT CONFIG)' "$config"
          grep -F 'find_dependency(SaltsUtils 4.1.3 EXACT CONFIG)' "$config"
          grep -F 'find_dependency(Chttp 1.1.4 EXACT CONFIG)' "$config"
          if grep -Eq 'Turbo(Net|Http|Utils|Parser)' "$config"; then
            echo "retired package escaped into installed config" >&2
            exit 1
          fi

      - name: Build installed TurboAgent consumer
        shell: bash
        run: |
          set -euxo pipefail
          consumer="$RUNNER_TEMP/turboagent-foundation-consumer"
          mkdir -p "$consumer"
          cat > "$consumer/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(turboagent_foundation_consumer LANGUAGES C)
          find_package(TurboAgent 1.0.0 EXACT CONFIG REQUIRED)
          add_executable(turboagent_foundation_consumer main.c)
          target_link_libraries(turboagent_foundation_consumer PRIVATE
            TurboAgent::RuntimeCore
            TurboAgent::RuntimeData
            TurboAgent::RuntimeTools
            TurboAgent::McpTools
            TurboAgent::LangChain)
          CMAKE
          cat > "$consumer/main.c" <<'C'
          #include <turbo_mcp_tool_pack.h>
          #include <turbo_runtime_json.h>
          #include <turbo_agent_runtime_remote_chttp.h>

          int main(void) {
            turbo_mcp_tool_pack_config_t config;
            turbo_mcp_tool_pack_config_init(&config);
            return config.abi_version == TURBO_MCP_TOOL_PACK_ABI_VERSION ? 0 : 1;
          }
          C

          cmake -S "$consumer" -B "$consumer/build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed/foundation" \
            -DCMAKE_PREFIX_PATH="/opt/turboagent/debug;/opt/chttp/debug;/opt/salts-utils/debug;/opt/salts/debug"
          cmake --build "$consumer/build" --verbose -j2

          vcpkg_libs="$(find "$GITHUB_WORKSPACE/vcpkg_installed/foundation" -type d \
            \( -path '*/x64-linux/debug/lib' -o -path '*/x64-linux/lib' \) -print | paste -sd: -)"
          export LD_LIBRARY_PATH="/opt/turboagent/debug/lib:/opt/chttp/debug/lib:/opt/salts-utils/debug/lib:/opt/salts/debug/lib:$vcpkg_libs:${LD_LIBRARY_PATH:-}"
          "$consumer/build/turboagent_foundation_consumer"

      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
