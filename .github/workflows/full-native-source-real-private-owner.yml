name: TurboAgent RPC actual Salts private-owner producer ASan (#1187)

'on':
  pull_request:
    paths:
      - '.github/workflows/full-native-source-real-private-owner.yml'
      - 'cmake/ci/chttp-rpc-sanitizer/**'
      - 'agent/tests/rpc_generated/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: turboagent-rpc-full-native-private-owner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-first-party-source:
    if: >-
      github.repository == 'qigao/TurboAgent' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'test/chttp-real-static-owner-source-123' &&
        github.event.pull_request.head.repo.full_name == 'qigao/TurboAgent') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/test/chttp-real-static-owner-source-123'))
    name: Actual Salts #1187 CFlow/CSTL static owner + SaltsUtils #641/#645 / ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    env:
      CC: gcc
      CXX: g++
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GRAPH_ROOT: /tmp/turboagent-fullsource-private-owner-${{ matrix.sanitizer }}
      PKG_ROOT: /tmp/turboagent-fullsource-private-owner-${{ matrix.sanitizer }}/prefix
      TSAN_OPTIONS: halt_on_error=1:exitcode=66
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CCACHE_DIR: ${{ github.workspace }}/.cache/rpc-fullsource-private-owner-${{ matrix.sanitizer }}
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Checkout exact reviewed TurboAgent PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout EXACT reviewed Salts static-private owner producer candidate PR #1187
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 3f55cea0f113ffde6702c08b5187144fd289b42a
          path: build/full-native-source/salts
          persist-credentials: false
      - name: Checkout exact public SaltsUtils 4.3.0-rc.10 tag
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: v4.3.0-rc.10
          path: build/full-native-source/salts-utils
          persist-credentials: false
      - name: Checkout immutable SaltsUtils Monocypher candidate PR #641
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: ceef02ae2eb1b1ecd167eb9305c70895a329baa0
          path: build/full-native-source/salts-utils-monocypher-640
          persist-credentials: false
      - name: Checkout immutable SaltsUtils typed-error candidate PR #645
        uses: actions/checkout@v4
        with:
          repository: qigao/salts-utils
          ref: 90900a245a6eadffe53b9f82fdb4e94150d54180
          path: build/full-native-source/salts-utils-error-644
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout exact public CHttp 2.1.0-rc.5 tag
        uses: actions/checkout@v4
        with:
          repository: qigao/chttp
          ref: v2.1.0-rc.5
          path: build/full-native-source/chttp
          persist-credentials: false
      - name: Restore pinned vcpkg binary cache and re2c host tools
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@0dc254695917bc180504d916240292e9096e9da5
        with:
          mode: read
      - name: Restore pinned re2c host generator
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@0dc254695917bc180504d916240292e9096e9da5
      - name: Install native build prerequisites
        uses: ./build/full-native-source/salts/.github/actions/setup-build-host
      - name: Attest every exact original release or reviewed candidate source
        shell: bash
        env:
          EXPECTED_AGENT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build nasm pkg-config ccache binutils
          mkdir -p "$GRAPH_ROOT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_AGENT"
          test "$(git -C build/full-native-source/salts rev-parse HEAD)" = '3f55cea0f113ffde6702c08b5187144fd289b42a'
          test "$(git -C build/full-native-source/salts-utils rev-parse HEAD)" = '1410c9fd479f9faab31503523d8e31cc506b5b25'
          test "$(git -C build/full-native-source/salts-utils-monocypher-640 rev-parse HEAD)" = 'ceef02ae2eb1b1ecd167eb9305c70895a329baa0'
          test "$(git -C build/full-native-source/salts-utils-error-644 rev-parse HEAD)" = '90900a245a6eadffe53b9f82fdb4e94150d54180'
          test "$(git -C build/full-native-source/salts-utils-error-644 rev-parse HEAD^)" = 'baf414b76ec68388c33de244f51dfda3387b7e50'
          test "$(git -C build/full-native-source/chttp rev-parse HEAD)" = '251d9ca60b1526ceab9d02f7f68e18fe060ce6f5'
          {
            echo "turboagent_source=$EXPECTED_AGENT"
            echo 'salts_source_kind=REVIEWED_PRODUCER_CANDIDATE_PR1187_NOT_A_RELEASE'
            echo 'salts_source=3f55cea0f113ffde6702c08b5187144fd289b42a'
            echo 'saltsutils_tag=v4.3.0-rc.10'
            echo 'saltsutils_source=1410c9fd479f9faab31503523d8e31cc506b5b25'
            echo 'chttp_tag=v2.1.0-rc.5'
            echo 'chttp_source=251d9ca60b1526ceab9d02f7f68e18fe060ce6f5'
            echo "sanitizer=${{ matrix.sanitizer }}"
            echo 'qualification=CANDIDATE_source-built-first-party-entire-RPC-graph'
            echo 'original_SaltsUtils_CHttp_tags_unmodified=true'
            echo 'real_Salts_rc15_tag_not_qualified=true'
            echo 'CSTL_CFlow_visibility_test_overlay_applied=false'
            echo 'candidate_saltsutils_640_commit=ceef02ae2eb1b1ecd167eb9305c70895a329baa0'
            echo 'candidate_monocypher_namespace=PR641_four_files_only'
            echo 'candidate_databind_methodplan=PR645_stacked_on_PR643'
            echo 'candidate_databind_methodplan_commit=90900a245a6eadffe53b9f82fdb4e94150d54180'
            echo 'candidate_typed_error_invariant=SCHEMA_for_unowned_rpc_error'
            echo 'candidate_salts_CSTL=ACTUAL_PRODUCER_CMake_STATIC_ONLY_HIDE'
            echo 'candidate_salts_CFlow=ACTUAL_PRODUCER_CMake_STATIC_ONLY_HIDE'
            echo 'actual_published_RC_SDK_qualification=NOT_COVERED'
            echo 'official_published_NuGet_binaries_used_for_link=false'
            echo 'normal_published_NuGet_consumer_gate=separate'
          } | tee "$GRAPH_ROOT/provenance.txt"

      - name: Apply explicitly pinned candidate source overlay; keep originals identified
        shell: bash
        run: |
          set -euo pipefail
          release="$GITHUB_WORKSPACE/build/full-native-source/salts-utils"
          candidate="$GITHUB_WORKSPACE/build/full-native-source/salts-utils-monocypher-640"
          for path in vendor/monocypher/CMakeLists.txt \
                      vendor/monocypher/databind_monocypher.c \
                      vendor/monocypher/databind_monocypher_namespace.h \
                      databind/runtime/data_bind_contract_fingerprint.c; do
            cp "$candidate/$path" "$release/$path"
          done
          error_candidate="$GITHUB_WORKSPACE/build/full-native-source/salts-utils-error-644"
          cp "$error_candidate/databind/runtime/data_bind_method_plan.c" \
            "$release/databind/runtime/data_bind_method_plan.c"
          cmp -s "$error_candidate/databind/runtime/data_bind_method_plan.c" \
            "$release/databind/runtime/data_bind_method_plan.c"
          test "$(git -C "$release" diff --name-only | wc -l)" -eq 3
          test "$(git -C "$release" ls-files --others --exclude-standard | wc -l)" -eq 2
          {
            echo "candidate_overlay=three_changed_and_two_new_files_PR641_and_PR645"
            sha256sum "$release/vendor/monocypher/databind_monocypher_namespace.h"
            sha256sum "$release/vendor/monocypher/databind_monocypher.c"
            sha256sum "$release/databind/runtime/data_bind_method_plan.c"
          } | tee -a "$GRAPH_ROOT/provenance.txt"
          # This source overlay is intentionally NOT the immutable published
          # SaltsUtils rc.10 binary; exact-tag acceptance remains a separate CI.
      - name: Set independent sanitizer and source prefixes
        shell: bash
        env:
          KIND: ${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          if [ "$KIND" = thread ]; then
            printf '%s\n' 'SAN_THREAD=ON' 'SAN_ADDRESS=OFF' 'SAN_UNDEFINED=OFF' \
              'SAN_FLAGS=-fsanitize=thread -g -fno-omit-frame-pointer' \
              'SAN_LINK=-fsanitize=thread' >> "$GITHUB_ENV"
          else
            printf '%s\n' 'SAN_THREAD=OFF' 'SAN_ADDRESS=ON' 'SAN_UNDEFINED=ON' \
              'SAN_FLAGS=-fsanitize=address -fsanitize=undefined -g -fno-omit-frame-pointer' \
              'SAN_LINK=-fsanitize=address -fsanitize=undefined' >> "$GITHUB_ENV"
          fi
          {
            echo "SALTS_ROOT=$GRAPH_ROOT/prefix/salts"
            echo "SALTS_UTILS_ROOT=$GRAPH_ROOT/prefix/salts-utils"
            echo "DATABIND_ROOT=$GRAPH_ROOT/prefix/salts-utils"
            echo "CHTTP_ROOT=$GRAPH_ROOT/prefix/chttp"
            echo "LD_LIBRARY_PATH=$GRAPH_ROOT/prefix/chttp/lib:$GRAPH_ROOT/prefix/salts-utils/lib:$GRAPH_ROOT/prefix/salts/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:$GITHUB_WORKSPACE/vcpkg_installed/ci-linux-release/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          echo "$GRAPH_ROOT/prefix/salts-utils/bin" >> "$GITHUB_PATH"

      - name: Build + install instrumented exact Salts CNet / CMeta sources
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux-dev-ci -S "$GITHUB_WORKSPACE/build/full-native-source/salts" \
            -B "$GRAPH_ROOT/build-salts" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$SALTS_ROOT" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_THREAD="$SAN_THREAD" \
            -DENABLE_SANITIZER_ADDRESS="$SAN_ADDRESS" \
            -DENABLE_SANITIZER_UNDEFINED="$SAN_UNDEFINED" \
            -DCMAKE_PROJECT_INCLUDE="$GITHUB_WORKSPACE/cmake/ci/chttp-rpc-sanitizer/qualify_private_vendor_symbols.cmake" \
            -DCMAKE_C_FLAGS="$SAN_FLAGS" -DCMAKE_CXX_FLAGS="$SAN_FLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$SAN_LINK" \
            -DCMAKE_EXE_LINKER_FLAGS="$SAN_LINK"
          cmake --build "$GRAPH_ROOT/build-salts" --parallel 2
          cmake --install "$GRAPH_ROOT/build-salts"
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"

      - name: Build + install instrumented exact SaltsUtils DataBind / IDL sources
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-linux-release-user \
            -S "$GITHUB_WORKSPACE/build/full-native-source/salts-utils" \
            -B "$GRAPH_ROOT/build-salts-utils" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$SALTS_UTILS_ROOT" \
            -DCMAKE_PREFIX_PATH="$SALTS_ROOT" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_THREAD="$SAN_THREAD" \
            -DENABLE_SANITIZER_ADDRESS="$SAN_ADDRESS" \
            -DENABLE_SANITIZER_UNDEFINED="$SAN_UNDEFINED" \
            -DCMAKE_PROJECT_INCLUDE="$GITHUB_WORKSPACE/cmake/ci/chttp-rpc-sanitizer/qualify_private_vendor_symbols.cmake" \
            -DCMAKE_C_FLAGS="$SAN_FLAGS" -DCMAKE_CXX_FLAGS="$SAN_FLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$SAN_LINK" \
            -DCMAKE_EXE_LINKER_FLAGS="$SAN_LINK"
          cmake --build "$GRAPH_ROOT/build-salts-utils" --parallel 2
          cmake --install "$GRAPH_ROOT/build-salts-utils"
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -x "$SALTS_UTILS_ROOT/bin/salts-idlc"

      - name: Build + install instrumented exact CHttp RPC Server / Client
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-linux-release-user \
            -S "$GITHUB_WORKSPACE/build/full-native-source/chttp" \
            -B "$GRAPH_ROOT/build-chttp" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$CHTTP_ROOT" \
            -DCMAKE_PREFIX_PATH="$SALTS_ROOT;$SALTS_UTILS_ROOT" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTS=OFF -DBUILD_TESTING=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DENABLE_SANITIZER_THREAD="$SAN_THREAD" \
            -DENABLE_SANITIZER_ADDRESS="$SAN_ADDRESS" \
            -DENABLE_SANITIZER_UNDEFINED="$SAN_UNDEFINED" \
            -DCMAKE_C_FLAGS="$SAN_FLAGS" -DCMAKE_CXX_FLAGS="$SAN_FLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$SAN_LINK" \
            -DCMAKE_EXE_LINKER_FLAGS="$SAN_LINK"
          cmake --build "$GRAPH_ROOT/build-chttp" --parallel 2
          cmake --install "$GRAPH_ROOT/build-chttp"
          test -f "$CHTTP_ROOT/lib/cmake/Chttp/ChttpConfig.cmake"

      # Unlike the released-tag baseline gate, this integrated candidate
      # uses the actual ASan+UBSan-instrumented host IDLC built and installed
      # from the same four-source graph. #639 / Draft #646 separately proved
      # its test-only static-hidden CSTL ownership without ODR suppression.
      - name: Prove and execute source-built, sanitizer-instrumented IDLC
        shell: bash
        run: |
          set -euo pipefail
          exe="$SALTS_UTILS_ROOT/bin/salts-idlc"
          test -x "$exe"
          python3 - <<'PY' | tee "$GRAPH_ROOT/source-idlc-link-audit.json"
          import json
          import os
          from pathlib import Path
          import re
          import shlex
          import subprocess
          root = Path(os.environ["GRAPH_ROOT"])
          build = root / "build-salts-utils"
          rows = json.loads((build / "compile_commands.json").read_text())
          matches = [r for r in rows if
                     r.get("file", "").replace("\\", "/").endswith("/databind/compiler/main.c")]
          if len(matches) != 1:
              raise SystemExit("required source IDLC main.c missing")
          row = matches[0]
          command = row.get("command") or " ".join(row.get("arguments", []))
          flags = ("-fsanitize=address", "-fsanitize=undefined")
          if not all(f in command for f in flags):
              raise SystemExit("source IDLC main.c not ASan/UBSan instrumented")
          args = row.get("arguments") or shlex.split(command)
          if "-o" not in args:
              raise SystemExit("source IDLC compiler object output unspecified")
          obj = Path(args[args.index("-o") + 1])
          if not obj.is_absolute():
              obj = Path(row.get("directory", str(build))) / obj
          if not obj.is_file():
              raise SystemExit("source IDLC compiled object missing")
          lines = subprocess.run(
              ["ninja", "-C", str(build), "-t", "commands", "salts_idlc"],
              check=True, capture_output=True, text=True).stdout.splitlines()
          links = [line for line in lines
                   if re.search(r"-o (?:[^ ]*/)?bin/salts-idlc(?:\s|$)", line)
                   and " -c " not in line]
          if len(links) != 1 or not all(f in links[0] for f in flags):
              raise SystemExit("source IDLC final link lacks ASan+UBSan flags")
          print(json.dumps({
              "kind": "SOURCE_BUILT_IDLC_EXECUTABLE",
              "source_object": str(obj),
              "compiler_flags": list(flags),
              "final_executable_sanitized": True,
              "published_host_generator_used": False,
          }, indent=2))
          PY
          ldd "$exe" | tee "$GRAPH_ROOT/source-built-idlc-linked-libraries.txt"
          grep -F "$SALTS_ROOT/lib/libsalts.so" "$GRAPH_ROOT/source-built-idlc-linked-libraries.txt"
          grep -F 'libasan.so' "$GRAPH_ROOT/source-built-idlc-linked-libraries.txt"
          grep -F 'libubsan.so' "$GRAPH_ROOT/source-built-idlc-linked-libraries.txt"
          output="$GRAPH_ROOT/source-idlc-preflight"
          mkdir -p "$output"
          "$exe" "$GITHUB_WORKSPACE/agent/tests/rpc_generated/turboagent_typed_rpc.schema" \
            --lang c --output "$output/typed_records.h" \
            --source-output "$output/typed_records.c"
          test -s "$output/typed_records.h"
          test -s "$output/typed_records.c"
          sha256sum "$output/typed_records.h" "$output/typed_records.c" \
            | tee "$GRAPH_ROOT/source-idlc-preflight.sha256"
          echo 'asan_codegen_host=SOURCE_BUILT_ASAN_UBSAN_NO_PUBLISHED_IDLC' >> "$GRAPH_ROOT/provenance.txt"

      - name: Verify private vendored crypto globals are not exported from native DSOs
        shell: bash
        run: |
          set -euo pipefail
          # Exact-tag source builds link separate private Monocypher archives.
          # Their crypto_argon2_no_extras storage must never be globally
          # interposable across CNet and DataBind; keep ASan ODR checking ON.
          test -f "$SALTS_ROOT/lib/libcnet.so"
          test -f "$SALTS_UTILS_ROOT/lib/libdata_bind.so"
          for lib in "$SALTS_ROOT/lib/libcnet.so" "$SALTS_UTILS_ROOT/lib/libdata_bind.so"; do
            if nm -D --defined-only "$lib" | grep -Fq 'crypto_argon2_no_extras'; then
              echo "Unisolated duplicate vendor crypto global in $lib" >&2
              exit 1
            fi
          done
          echo 'private_monocypher_elf_visibility=hidden' >> "$GRAPH_ROOT/provenance.txt"
          echo 'asan_odr_detection=supported_and_not_disabled' >> "$GRAPH_ROOT/provenance.txt"

      - name: Build instrumented external TurboAgent IDL / real Provider DSO
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-linux-release -S "$GITHUB_WORKSPACE" \
            -B "$GRAPH_ROOT/build-turboagent" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="$SALTS_ROOT;$SALTS_UTILS_ROOT;$CHTTP_ROOT" \
            -DSaltsUtils_IDLC_EXECUTABLE="$SALTS_UTILS_ROOT/bin/salts-idlc" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTS=ON -DENABLE_WASM_TOOLS=OFF -DENABLE_PRAKTOR_TOOLS=OFF \
            -DENABLE_CODEX_BRIDGE=OFF -DENABLE_CODING_TOOLS=OFF \
            -DENABLE_SANITIZER_THREAD="$SAN_THREAD" \
            -DENABLE_SANITIZER_ADDRESS="$SAN_ADDRESS" \
            -DENABLE_SANITIZER_UNDEFINED="$SAN_UNDEFINED" -DENABLE_SANITIZER_LEAK=OFF \
            -DCMAKE_C_FLAGS="$SAN_FLAGS -DTURBOAGENT_RPC_INTEGRATED_ERROR_CANDIDATE=1" \
            -DCMAKE_CXX_FLAGS="$SAN_FLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$SAN_LINK" \
            -DCMAKE_EXE_LINKER_FLAGS="$SAN_LINK"
          cmake --build "$GRAPH_ROOT/build-turboagent" \
            --target test_turboagent_typed_rpc --parallel 2

      - name: Audit all actual source units, final links and imported prefixes
        shell: bash
        env:
          KIND: ${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          python3 cmake/ci/chttp-rpc-sanitizer/audit_full_source_closure.py \
            "$GRAPH_ROOT" "$KIND" monocypher-candidate | tee "$GRAPH_ROOT/full-source-audit.json"
          # The explicit audit must succeed before any runtime pass counts.
          ldd "$GRAPH_ROOT/build-turboagent/bin/test_turboagent_typed_rpc" \
            | tee "$GRAPH_ROOT/actual-linked-native-libraries.txt"

      - name: Run exact generated typed RPC + active native Provider DSO 10x
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 850s \
            ctest --test-dir "$GRAPH_ROOT/build-turboagent" \
            -R '^test_turboagent_typed_rpc$' --repeat until-fail:10 \
            --no-tests=error --timeout 120 --output-on-failure

      - name: Preserve first-party source sanitizer evidence and first failing trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turboagent-123-actual-salts-private-owner-CANDIDATE-${{ matrix.sanitizer }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.GRAPH_ROOT }}/provenance.txt
            ${{ env.GRAPH_ROOT }}/full-source-audit.json
            ${{ env.GRAPH_ROOT }}/actual-linked-native-libraries.txt
            ${{ env.GRAPH_ROOT }}/source-idlc-link-audit.json
            ${{ env.GRAPH_ROOT }}/source-built-idlc-linked-libraries.txt
            ${{ env.GRAPH_ROOT }}/source-idlc-preflight.sha256
            ${{ env.GRAPH_ROOT }}/build-salts/compile_commands.json
            ${{ env.GRAPH_ROOT }}/build-salts-utils/compile_commands.json
            ${{ env.GRAPH_ROOT }}/build-chttp/compile_commands.json
            ${{ env.GRAPH_ROOT }}/build-turboagent/compile_commands.json
            ${{ env.GRAPH_ROOT }}/build-turboagent/Testing/Temporary/LastTest.log

      - name: Verify source checkout remains unchanged
        if: always()
        shell: bash
        env:
          EXPECTED_AGENT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_AGENT"
          test -z "$(git status --porcelain --untracked-files=no)"
