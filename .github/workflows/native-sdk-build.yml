name: Build and package TurboAgent native SDKs

on:
  workflow_call:
    inputs:
      salts_release_tag:
        description: Exact published Salts Release Tag (never a Git SHA)
        required: false
        type: string
        default: v2.3.0-rc.17
    outputs:
      version:
        description: TurboAgent project version
        value: ${{ jobs.metadata.outputs.version }}

permissions:
  contents: read
  packages: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  # Reproducible published package selection. Update tags in a reviewed PR;
  # the manual CI entry may qualify a new Salts tag before promoting it.
  SALTS_RELEASE_TAG: ${{ inputs.salts_release_tag || 'v2.3.0-rc.17' }}
  SALTS_UTILS_RELEASE_TAG: v4.3.0-rc.11
  CHTTP_RELEASE_TAG: v2.1.0-rc.6
  TURBOSCRIPT_RELEASE_TAG: v3.0.10
  PRAKTOR_RELEASE_TAG: v0.4.8
  TURBOWASM_RELEASE_TAG: v0.2.1

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test package transport and qualification guards offline
        run: |
          cmake -S cmake/ci/tests -B build/ci-transport-tests
          ctest --test-dir build/ci-transport-tests --output-on-failure --no-tests=error

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          text = Path("CMakeLists.txt").read_text(encoding="utf-8")
          match = re.search(r"project\(\s*TurboAgent\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)", text, re.S)
          if not match:
              raise SystemExit("TurboAgent project version not found")
          version = match.group(1)
          manifest = json.loads(Path("vcpkg.json").read_text(encoding="utf-8"))
          if manifest.get("version-semver") != version:
              raise SystemExit("vcpkg.json version does not match CMake project version")
          print(version)
          PY
          )"
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            package_version="$version"
          else
            package_version="$version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            preset: ci-linux-release
            praktor: 1
            tests: true
          - rid: windows-x64
            runner: windows-2025
            preset: ci-windows-release
            praktor: 0
            tests: true
          - rid: macos-arm64
            runner: macos-15
            preset: ci-macos-release
            praktor: 1
            tests: false
          - rid: android-arm64-v8a
            runner: ubuntu-24.04
            preset: ci-android-release
            praktor: 1
            tests: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci-tools

      - name: Prepare Linux toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm

      - name: Prepare macOS toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: brew install ninja nasm

      - name: Prepare Windows Ninja for llvm-mingw SDK builds
        if: matrix.rid == 'windows-x64'
        shell: pwsh
        run: choco install ninja -y --no-progress

      # Use the same compiler choice as the actual first-party product build.
      # Android uses NDK Clang; no extra Clang/smoke/version CI is created.
      - name: Select Linux/macOS runner LLVM/Clang
        if: matrix.rid == 'linux-x64' || matrix.rid == 'macos-arm64'
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-native@971d5d11325d01edef423e1d039afaec0409b2fe
        with:
          build-type: toolchain-only
          obfuscator: "true"
      - name: Select Windows llvm-mingw UCRT
        if: matrix.rid == 'windows-x64'
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@971d5d11325d01edef423e1d039afaec0409b2fe
        with:
          version: "20261020"
          target: x64
          build-type: toolchain-only
          obfuscator: "true"
      - name: Expose Windows native paths to existing SDK and CMake build
        if: matrix.rid == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('VCPKG_ROOT', 'VCPKG_CACHE_REPOSITORY_ROOT', 'RE2C_ROOT')) {
            $path = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($path)) { throw "$name must be installed" }
            "$name=$($path.Replace('\', '/'))" >> $env:GITHUB_ENV
          }
          "CC=$env:LLVM_MINGW_CC" >> $env:GITHUB_ENV
          "CXX=$env:LLVM_MINGW_CXX" >> $env:GITHUB_ENV
      - name: Restore native SDKs on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_RID: ${{ matrix.rid }}
          WITH_PRAKTOR: ${{ matrix.praktor }}
        run: bash cmake/ci/restore-native-sdk.sh "$SDK_RID" "$WITH_PRAKTOR" 1

      - name: Restore native SDKs on Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdk.sh windows-x64 0 1

      - name: Configure on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDK_PRESET: ${{ matrix.preset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python cmake/ci/restore-vcpkg-cache.py "$SDK_PRESET"
          cmake --preset "$SDK_PRESET" -DVCPKG_INSTALL_OPTIONS=--only-binarycaching

      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python cmake/ci/restore-vcpkg-cache.py ci-windows-release
          if errorlevel 1 exit /b 1
          cmake --preset ci-windows-release -DVCPKG_INSTALL_OPTIONS=--only-binarycaching

      - name: Build on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDK_PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$SDK_PRESET"

      - name: Verify Linux PraktorTools resolves CSTL hash inside the DSO
        if: success() && matrix.rid == 'linux-x64' && matrix.praktor == 1
        shell: bash
        run: |
          set -euo pipefail
          lib=build/ci-linux-release/bin/libpraktor_tools.so
          test -f "$lib"
          if nm -D --undefined-only "$lib" |
             grep -Eq '[[:space:]]U[[:space:]]+hash_bytes(@|$)'; then
            echo "PraktorTools has an unresolved private CSTL hash import" >&2
            exit 1
          fi
          echo "PraktorTools CSTL hash symbol ownership: resolved in DSO"

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: cmake --build --preset ci-windows-release

      - name: Verify Linux PraktorTools has no executable-bound CSTL hash dependency
        if: success() && matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          lib=build/ci-linux-release/bin/libpraktor_tools.so
          test -f "$lib"
          # hash_bytes remains image-local. The PraktorTools shared object
          # must not import this hidden static symbol from its consumers.
          if nm -D --undefined-only "$lib" |
             grep -Eq '[[:space:]]U[[:space:]]+hash_bytes(@|$)'; then
            echo "PraktorTools has an unresolved private CSTL hash import" >&2
            exit 1
          fi
          echo "PraktorTools CSTL hash symbol ownership: resolved in DSO"

      - name: Test on Unix
        if: runner.os != 'Windows' && matrix.tests
        shell: bash
        env:
          SDK_PRESET: ${{ matrix.preset }}
        run: ctest --preset "$SDK_PRESET"

      - name: Test SQLite VFS recovery on macOS
        if: matrix.rid == 'macos-arm64'
        shell: bash
        run: ctest --preset ci-macos-sqlite-vfs --verbose --no-tests=error

      - name: Test Job file verification and recovery on macOS arm64
        if: matrix.rid == 'macos-arm64'
        shell: bash
        run: |
          python cmake/ci/run-job-file-conformance.py \
            --build-dir "$PWD/build/ci-macos-release" \
            --evidence-dir "$PWD/build/job-file-conformance/macos-arm64/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --preset ci-macos-job-files \
            --expected-commit "$GITHUB_SHA" --require-macos-arm64

      - name: Retain macOS Job file verification evidence
        if: always() && matrix.rid == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: job-file-conformance-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/job-file-conformance/macos-arm64/
            build/ci-macos-release/harness/tests/process_crash/cases/
          if-no-files-found: warn

      # Manual Release-Tag qualification is strictly an installed-package
      # consumer test. Prove CMake consumed the published .nupkg identified
      # by the tag and digest, never a source-SHA candidate or stale cache.
      - name: Verify Windows published Salts Release Tag and CMake origin
        if: matrix.rid == 'windows-x64' && matrix.tests && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Join-Path $env:GITHUB_WORKSPACE "build/release-provenance/windows-x64.txt"
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw "No SDK release provenance" }
          $tag = $env:SALTS_RELEASE_TAG
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') {
            throw "Invalid published Salts tag: $tag"
          }
          $asset = "Salts.Native.$($tag.Substring(1)).nupkg"
          $prefix = "repo=qigao/salts tag=$tag asset=$asset sha256="
          $records = @(Get-Content -LiteralPath $manifest | Where-Object { $_.StartsWith($prefix) })
          if ($records.Count -ne 1 -or $records[0].Substring($prefix.Length) -cnotmatch '^[0-9a-f]{64}$') {
            throw "Missing or ambiguous exact published Salts asset digest"
          }
          $cache = "build/ci-windows-release/CMakeCache.txt"
          $entries = @(Get-Content -LiteralPath $cache | Where-Object { $_ -match '^Salts_DIR:PATH=' })
          if ($entries.Count -ne 1) { throw "Missing unique installed Salts_DIR" }
          $actual = [IO.Path]::GetFullPath(($entries[0] -split '=', 2)[1])
          $expected = [IO.Path]::GetFullPath((Join-Path $env:SALTS_ROOT "lib/cmake/Salts"))
          if ($actual -ine $expected) {
            throw "Salts package provenance mismatch: $actual vs $expected"
          }
          Write-Host "Published SDK acceptance: tag=$tag asset=$asset; CMake installed root verified"

      - name: Repeat Windows released-Salts workspace cancellation (20x)
        if: matrix.rid == 'windows-x64' && matrix.tests && github.event_name == 'workflow_dispatch'
        shell: cmd
        run: |
          ctest --preset ci-windows-release --no-tests=error --output-on-failure --repeat until-fail:20 -R "^test_turbo_coding_workspace$"

      - name: Test on Windows
        if: runner.os == 'Windows' && matrix.tests
        shell: cmd
        run: ctest --preset ci-windows-release

      # #180 qualified the suite budget using recorded fresh-process runs.
      # Keep extended timing on manual acceptance; ordinary CI runs the full
      # suite above once, including every storage assertion and child deadline.
      - name: Measure Windows CLI storage in five fresh processes
        if: runner.os == 'Windows' && matrix.tests && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $directory = Join-Path $env:GITHUB_WORKSPACE "build/cli-storage-timing"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          @(
            "commit=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
            "processor=$env:PROCESSOR_IDENTIFIER"
            "processor_count=$env:NUMBER_OF_PROCESSORS"
            "preset=ci-windows-release"
            "order=after-full-suite;serial;five-new-CTest-and-test-processes"
            "case_times=TinyTest-body-only;CTest-includes-fixtures;wall-includes-VS-wrapper"
          ) | Set-Content "$directory/context.txt"
          & ctest --version | Add-Content "$directory/context.txt"
          Select-String -Path "build/ci-windows-release/CMakeCache.txt" `
            -Pattern '^(CMAKE_C_COMPILER|CMAKE_BUILD_TYPE|CMAKE_GENERATOR|Salts_DIR):' |
            ForEach-Object { $_.Line } | Add-Content "$directory/context.txt"
          Copy-Item "build/release-provenance/windows-x64.txt" "$directory/dependencies.txt"
          $measurements = @()
          foreach ($iteration in 1..5) {
            Write-Host "CLI storage iteration $iteration/5"
            $watch = [Diagnostics.Stopwatch]::StartNew()
            & ctest --preset ci-windows-release `
              --no-tests=error --verbose -R "^test_turbo_cli_storage$" `
              --output-log "$directory/iteration-$iteration.log" `
              --output-junit "$directory/iteration-$iteration.xml"
            $result = $LASTEXITCODE
            $watch.Stop()
            $measurements += [pscustomobject]@{
              iteration = $iteration
              wall_ms = $watch.ElapsedMilliseconds
              ctest_exit = $result
            }
            $measurements | Export-Csv "$directory/measurements.csv" -NoTypeInformation
            if ($result -ne 0) { exit $result }
          }

      - name: Retain Windows CLI storage timing and failure output
        if: always() && runner.os == 'Windows' && matrix.tests && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cli-storage-timing-windows
          path: build/cli-storage-timing/
          if-no-files-found: warn

      - name: Install on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDK_PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "install-$SDK_PRESET"

      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: cmake --build --preset install-ci-windows-release

      - name: Verify relocated installed SDK consumers on Linux
        if: matrix.rid == 'linux-x64'
        shell: bash
        env:
          SDK_RID: ${{ matrix.rid }}
        run: cmake -P cmake/ci/verify-installed-sdk.cmake

      - name: Verify relocated installed SDK consumers on Windows
        if: matrix.rid == 'windows-x64'
        shell: cmd
        env:
          SDK_RID: ${{ matrix.rid }}
        run: cmake -P cmake/ci/verify-installed-sdk.cmake

      - name: Record SDK provenance
        shell: bash
        env:
          SDK_RID: ${{ matrix.rid }}
          WITH_PRAKTOR: ${{ matrix.praktor }}
          SDK_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          praktor=off
          if [[ "$WITH_PRAKTOR" == 1 ]]; then praktor=on; fi
          printf 'version=%s\ncommit=%s\nrid=%s\npraktor_tools=%s\n' \
            "$SDK_VERSION" "$GITHUB_SHA" "$SDK_RID" "$praktor" \
            > "build/sdk/$SDK_RID/turboagent-sdk-manifest.txt"
          # Source-owner protection is derived from this product build CMake cache.
          # This metadata is not a Clang, plugin ABI or IR validation step.
          cache="build/${{ matrix.preset }}/CMakeCache.txt"
          test -s "$cache"
          protection=disabled
          configuration="$(sed -n 's/^CMAKE_BUILD_TYPE:[A-Za-z_]*=//p' "$cache")"
          case "$configuration" in
            Release|MinSizeRel|RelWithDebInfo)
              if grep -Fxq 'QIGAO_COMPILER_OBFUSCATION_ENABLED:BOOL=ON' "$cache"; then
                protection=enabled
              fi
              ;;
          esac
          echo "source_protection=$protection" >> "build/sdk/$SDK_RID/turboagent-sdk-manifest.txt"
          # Dependency selection uses Release Tags, never commit SHAs.
          # The manifest records exactly which release assets and bytes were used.
          release_manifest="build/release-provenance/$SDK_RID.txt"
          test -s "$release_manifest"
          cat "$release_manifest" >> "build/sdk/$SDK_RID/turboagent-sdk-manifest.txt"

      - name: Export final NuGet consumer dependencies
        if: matrix.tests
        shell: bash
        run: python cmake/ci/verify-nuget-sdk.py stage --rid '${{ matrix.rid }}'

      - uses: actions/upload-artifact@v4
        if: matrix.tests
        with:
          name: turboagent-consumer-context-${{ matrix.rid }}
          path: build/nuget-consumer-context/${{ matrix.rid }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: turboagent-sdk-${{ matrix.rid }}
          path: build/sdk
          if-no-files-found: error
          compression-level: 9

  pack:
    name: Pack TurboAgent.Native
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: turboagent-sdk-*
          path: package/sdk
          merge-multiple: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Configure offline NuGet packaging
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/nuget.config"
          printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          echo "NUGET_CONFIG=$config" >> "$GITHUB_ENV"

      - name: Create NuGet package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          dotnet restore packaging/nuget/TurboAgent.Native.csproj \
            --configfile "$NUGET_CONFIG" --packages "$RUNNER_TEMP/pack-nuget"
          dotnet pack packaging/nuget/TurboAgent.Native.csproj \
            --no-restore --configuration Release --output dist \
            -p:PackageVersion="$PACKAGE_VERSION" \
            -p:PackageRoot="$GITHUB_WORKSPACE/package" \
            -p:RestorePackagesPath="$RUNNER_TEMP/pack-nuget"

      - uses: actions/upload-artifact@v4
        with:
          name: turboagent-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  consume-package:
    name: Final NuGet consumer (${{ matrix.rid }})
    needs: [metadata, pack]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: windows-x64
            runner: windows-2025
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
      SDK_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: turboagent-native-nuget
          path: build/final-nuget

      - uses: actions/download-artifact@v4
        with:
          name: turboagent-consumer-context-${{ matrix.rid }}
          path: build/final-nuget-context

      - name: Select Windows llvm-mingw for real NuGet consumption
        if: matrix.rid == 'windows-x64'
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@971d5d11325d01edef423e1d039afaec0409b2fe
        with:
          version: "20261020"
          target: x64
          build-type: toolchain-only
      - name: Export Windows Clang compiler for package consumption
        if: matrix.rid == 'windows-x64'
        shell: pwsh
        run: |
          "CC=$env:LLVM_MINGW_CC" >> $env:GITHUB_ENV
          "CXX=$env:LLVM_MINGW_CXX" >> $env:GITHUB_ENV
      - name: Consume final NuGet on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          python cmake/ci/verify-nuget-sdk.py consume --rid linux-x64
          --package-dir build/final-nuget --context-dir build/final-nuget-context

      - name: Consume final NuGet on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          python cmake/ci/verify-nuget-sdk.py consume --rid windows-x64
          --package-dir build/final-nuget --context-dir build/final-nuget-context
