name: Build and package TurboAgent native SDKs

on:
  workflow_call:
    outputs:
      version:
        description: TurboAgent project version
        value: ${{ jobs.metadata.outputs.version }}

permissions:
  contents: read
  packages: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          text = Path("CMakeLists.txt").read_text(encoding="utf-8")
          match = re.search(r"project\(\s*TurboAgent\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)", text, re.S)
          if not match:
              raise SystemExit("TurboAgent project version not found")
          version = match.group(1)
          manifest = json.loads(Path("vcpkg.json").read_text(encoding="utf-8"))
          if manifest.get("version-semver") != version:
              raise SystemExit("vcpkg.json version does not match CMake project version")
          print(version)
          PY
          )"
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            package_version="$version"
          else
            package_version="$version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            preset: ci-linux-release
            praktor: 1
            tests: true
          - rid: windows-x64
            runner: windows-2025
            preset: ci-windows-release
            praktor: 0
            tests: true
          - rid: macos-arm64
            runner: macos-15
            preset: ci-macos-release
            praktor: 1
            tests: false
          - rid: android-arm64-v8a
            runner: ubuntu-24.04
            preset: ci-android-release
            praktor: 1
            tests: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Prepare Linux toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm

      - name: Prepare macOS toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: brew install ninja nasm

      - name: Locate MSVC toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) {
            throw "MSVC x64 toolchain is required"
          }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV
          # The setup actions expose Windows-native paths; presets consume CMake paths.
          foreach ($name in @('VCPKG_ROOT', 'VCPKG_CACHE_REPOSITORY_ROOT', 'RE2C_ROOT')) {
            $path = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($path)) { throw "$name is required" }
            "$name=$($path.Replace('\', '/'))" >> $env:GITHUB_ENV
          }

      - name: Restore native SDKs on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_RID: ${{ matrix.rid }}
          WITH_PRAKTOR: ${{ matrix.praktor }}
        run: bash cmake/ci/restore-native-sdk.sh "$SDK_RID" "$WITH_PRAKTOR" 1

      - name: Restore native SDKs on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdk.ps1 -Rid windows-x64 -WithWasm

      # Diagnostic-only, isolated from release/package pins. The official SDKs
      # are restored above; this exact source candidate replaces only the
      # Windows Salts root for the downstream lifecycle regression.
      - name: Checkout exact Salts Job Object candidate
        if: matrix.rid == 'windows-x64'
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 42e04613b9f1a5ec02d5526f982e25b55e69259c
          path: _candidate/salts
          persist-credentials: false

      # Use the same exact-source composite host setup that passed
      # upstream Salts #1230: installs Ninja/NASM and explicitly sets the
      # canonical VCPKG_WINDOWS_TRIPLET (never infer an empty triplet).
      - name: Prepare isolated Salts Windows build host
        if: matrix.rid == 'windows-x64'
        uses: ./_candidate/salts/.github/actions/setup-build-host

      - name: Verify exact upstream candidate source SHA
        if: matrix.rid == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sha = (git -C "_candidate/salts" rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -ne "42e04613b9f1a5ec02d5526f982e25b55e69259c") {
            throw "Salts source mismatch: $sha"
          }

      - name: Build and install isolated Windows Salts candidate SDK
        if: matrix.rid == 'windows-x64'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          pushd "_candidate\salts"
          if errorlevel 1 exit /b 1
          cmake --preset win-release-ci -DCMAKE_SUPPRESS_REGENERATION=ON -DENABLE_TESTS=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF -DCMETA_BUILD_BENCHMARKS=OFF
          if errorlevel 1 exit /b 1
          cmake --build --preset win-release-ci --parallel 2
          if errorlevel 1 exit /b 1
          cmake --build --preset install-win-release-ci --parallel 2
          if errorlevel 1 exit /b 1
          popd

      - name: Select only this exact Windows candidate SDK
        if: matrix.rid == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "_candidate/salts/stage/sdk/windows-x64"))
          $config = Join-Path $root "lib/cmake/Salts/SaltsConfig.cmake"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
            throw "Missing exact-source candidate SDK: $config"
          }
          "SALTS_ROOT=$($root.Replace('\', '/'))" >> $env:GITHUB_ENV
          "SALTS_CANDIDATE_SHA=42e04613b9f1a5ec02d5526f982e25b55e69259c" >> $env:GITHUB_ENV

      - name: Configure on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDK_PRESET: ${{ matrix.preset }}
        run: cmake --preset "$SDK_PRESET"

      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && cmake --preset ci-windows-release

      - name: Assert Windows TurboAgent consumed exact Salts candidate
        if: matrix.rid == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:SALTS_CANDIDATE_SHA -ne "42e04613b9f1a5ec02d5526f982e25b55e69259c") {
            throw "Unexpected candidate source"
          }
          $cacheFile = "build/ci-windows-release/CMakeCache.txt"
          $entries = @(Get-Content -LiteralPath $cacheFile | Where-Object { $_ -match '^Salts_DIR:PATH=' })
          if ($entries.Count -ne 1) { throw "Missing unique Salts_DIR CMake cache entry" }
          $actual = ($entries[0] -split '=', 2)[1]
          $expected = Join-Path $env:SALTS_ROOT "lib/cmake/Salts"
          $actualFull = [IO.Path]::GetFullPath($actual)
          $expectedFull = [IO.Path]::GetFullPath($expected)
          if ($actualFull -ine $expectedFull) {
            throw "Wrong Salts SDK used: $actualFull (expected $expectedFull)"
          }
          Write-Host "Exact Salts source $env:SALTS_CANDIDATE_SHA used: $actualFull"

      - name: Build on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDK_PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$SDK_PRESET"

      - name: Inspect real Linux ELF/DSO hidden hash_bytes references after linker failure
        if: failure() && matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          # Diagnostic only: preserve the FAILED status of Build on Unix.
          # Does not execute untrusted SDK code, change link flags, or
          # weaken Salts's static CSTL symbol-visibility policy.
          bash cmake/ci/audit-hidden-hash-dso-linux.sh build/ci-linux-release

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && cmake --build --preset ci-windows-release

      - name: Verify Linux PraktorTools has no executable-bound CSTL hash dependency
        if: success() && matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          lib=build/ci-linux-release/bin/libpraktor_tools.so
          test -f "$lib"
          # hash_bytes is intentionally image-local in the Salts CSTL
          # static archive. This shared object MUST NOT dynamically
          # import it from downstream executables or some unrelated DSO.
          if nm -D --undefined-only "$lib" |
             grep -Eq '[[:space:]]U[[:space:]]+hash_bytes(@|$)'; then
            echo "PraktorTools has an unresolved private CSTL hash import" >&2
            exit 1
          fi
          echo "PraktorTools CSTL hash symbol ownership: resolved in DSO"

      - name: Test on Unix
        if: runner.os != 'Windows' && matrix.tests
        shell: bash
        env:
          SDK_PRESET: ${{ matrix.preset }}
        run: ctest --preset "$SDK_PRESET"

      - name: Repeat Windows legacy cancellation and workspace cleanup (20x)
        if: matrix.rid == 'windows-x64' && matrix.tests
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && ctest --preset ci-windows-release --no-tests=error --output-on-failure --repeat until-fail:20 -R "^test_turbo_coding_workspace$"

      - name: Test on Windows
        if: runner.os == 'Windows' && matrix.tests
        shell: cmd
        run: call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && ctest --preset ci-windows-release

      - name: Install on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDK_PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "install-$SDK_PRESET"

      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && cmake --build --preset install-ci-windows-release

      - name: Record SDK provenance
        shell: bash
        env:
          SDK_RID: ${{ matrix.rid }}
          WITH_PRAKTOR: ${{ matrix.praktor }}
          SDK_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          praktor=off
          if [[ "$WITH_PRAKTOR" == 1 ]]; then praktor=on; fi
          printf 'version=%s\ncommit=%s\nrid=%s\npraktor_tools=%s\n' \
            "$SDK_VERSION" "$GITHUB_SHA" "$SDK_RID" "$praktor" \
            > "build/sdk/$SDK_RID/turboagent-sdk-manifest.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: turboagent-sdk-${{ matrix.rid }}
          path: build/sdk
          if-no-files-found: error
          compression-level: 9

  pack:
    name: Pack TurboAgent.Native
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: turboagent-sdk-*
          path: package/sdk
          merge-multiple: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Configure GitHub Packages source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/nuget.config"
          printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json             --name github --username qigao --password "$GITHUB_TOKEN"             --store-password-in-clear-text --configfile "$config"
          echo "NUGET_CONFIG=$config" >> "$GITHUB_ENV"

      - name: Create NuGet package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          dotnet restore packaging/nuget/TurboAgent.Native.csproj \
            --configfile "$NUGET_CONFIG" --packages "$RUNNER_TEMP/pack-nuget"
          dotnet pack packaging/nuget/TurboAgent.Native.csproj \
            --no-restore --configuration Release --output dist \
            -p:PackageVersion="$PACKAGE_VERSION" \
            -p:PackageRoot="$GITHUB_WORKSPACE/package" \
            -p:RestorePackagesPath="$RUNNER_TEMP/pack-nuget"

      - uses: actions/upload-artifact@v4
        with:
          name: turboagent-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error
