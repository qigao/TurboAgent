name: Build and package TurboAgent native SDKs

on:
  workflow_call:
    outputs:
      version:
        description: TurboAgent project version
        value: ${{ jobs.metadata.outputs.version }}

permissions:
  contents: read
  packages: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          text = Path("CMakeLists.txt").read_text(encoding="utf-8")
          match = re.search(r"project\(\s*TurboAgent\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)", text, re.S)
          if not match:
              raise SystemExit("TurboAgent project version not found")
          version = match.group(1)
          manifest = json.loads(Path("vcpkg.json").read_text(encoding="utf-8"))
          if manifest.get("version-semver") != version:
              raise SystemExit("vcpkg.json version does not match CMake project version")
          print(version)
          PY
          )"
          test -n "$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            package_version="$version"
          else
            package_version="$version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            preset: ci-linux-release
            praktor: 1
            tests: true
          - rid: windows-x64
            runner: windows-2025
            preset: ci-windows-release
            praktor: 0
            tests: true
          - rid: macos-arm64
            runner: macos-15
            preset: ci-macos-release
            praktor: 1
            tests: false
          - rid: android-arm64-v8a
            runner: ubuntu-24.04
            preset: ci-android-release
            praktor: 1
            tests: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Prepare Linux toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nasm

      - name: Prepare macOS toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: brew install ninja nasm

      - name: Locate MSVC toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) {
            throw "MSVC x64 toolchain is required"
          }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV
          # The setup actions expose Windows-native paths; presets consume CMake paths.
          foreach ($name in @('VCPKG_ROOT', 'VCPKG_CACHE_REPOSITORY_ROOT', 'RE2C_ROOT')) {
            $path = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($path)) { throw "$name is required" }
            "$name=$($path.Replace('\', '/'))" >> $env:GITHUB_ENV
          }

      - name: Restore native SDKs on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_RID: ${{ matrix.rid }}
          WITH_PRAKTOR: ${{ matrix.praktor }}
        run: bash cmake/ci/restore-native-sdk.sh "$SDK_RID" "$WITH_PRAKTOR" 1

      - name: Restore native SDKs on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdk.ps1 -Rid windows-x64 -WithWasm

      - name: Configure on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDK_PRESET: ${{ matrix.preset }}
        run: cmake --preset "$SDK_PRESET"

      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && cmake --preset ci-windows-release

      - name: Build on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDK_PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$SDK_PRESET"

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && cmake --build --preset ci-windows-release

      - name: Test macOS real Provider DSO unload
        if: matrix.rid == 'macos-arm64'
        shell: bash
        run: ctest --preset ci-macos-release -R '^test_turbo_component_dso_lifecycle$' --output-on-failure

      - name: Test on Unix
        if: runner.os != 'Windows' && matrix.tests
        shell: bash
        env:
          SDK_PRESET: ${{ matrix.preset }}
        run: ctest --preset "$SDK_PRESET"

      - name: Stress Provider DSO terminal/unload (Unix)
        if: matrix.rid == 'linux-x64' || matrix.rid == 'macos-arm64'
        shell: bash
        env:
          SDK_PRESET: ${{ matrix.preset }}
        run: ctest --preset "$SDK_PRESET" -R test_turbo_component_dso_lifecycle --repeat until-fail:25 --output-on-failure

      - name: Test on Windows
        if: runner.os == 'Windows' && matrix.tests
        shell: cmd
        run: call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && ctest --preset ci-windows-release

      - name: Stress Provider DSO terminal/unload (Windows)
        if: matrix.rid == 'windows-x64'
        shell: cmd
        run: call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && ctest --preset ci-windows-release -R test_turbo_component_dso_lifecycle --repeat until-fail:25 --output-on-failure

      - name: Install on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          SDK_PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "install-$SDK_PRESET"

      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && cmake --build --preset install-ci-windows-release

      - name: Record SDK provenance
        shell: bash
        env:
          SDK_RID: ${{ matrix.rid }}
          WITH_PRAKTOR: ${{ matrix.praktor }}
          SDK_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          praktor=off
          if [[ "$WITH_PRAKTOR" == 1 ]]; then praktor=on; fi
          printf 'version=%s\ncommit=%s\nrid=%s\npraktor_tools=%s\n' \
            "$SDK_VERSION" "$GITHUB_SHA" "$SDK_RID" "$praktor" \
            > "build/sdk/$SDK_RID/turboagent-sdk-manifest.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: turboagent-sdk-${{ matrix.rid }}
          path: build/sdk
          if-no-files-found: error
          compression-level: 9

  pack:
    name: Pack TurboAgent.Native
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: turboagent-sdk-*
          path: package/sdk
          merge-multiple: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Configure GitHub Packages source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/nuget.config"
          printf '<?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json             --name github --username qigao --password "$GITHUB_TOKEN"             --store-password-in-clear-text --configfile "$config"
          echo "NUGET_CONFIG=$config" >> "$GITHUB_ENV"

      - name: Create NuGet package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          dotnet restore packaging/nuget/TurboAgent.Native.csproj \
            --configfile "$NUGET_CONFIG" --packages "$RUNNER_TEMP/pack-nuget"
          dotnet pack packaging/nuget/TurboAgent.Native.csproj \
            --no-restore --configuration Release --output dist \
            -p:PackageVersion="$PACKAGE_VERSION" \
            -p:PackageRoot="$GITHUB_WORKSPACE/package" \
            -p:RestorePackagesPath="$RUNNER_TEMP/pack-nuget"

      - name: Test NuGet validation failure gates
        shell: bash
        run: python3 -m unittest discover -s packaging/nuget -p 'test_verify_exact_package.py' -v

      - name: Verify exact-run NuGet archive provenance and platform contents
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          python3 packaging/nuget/verify_exact_package.py \
            "dist/TurboAgent.Native.${PACKAGE_VERSION}.nupkg" \
            --commit "$GITHUB_SHA" \
            --package-version "$PACKAGE_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: turboagent-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  consume-linux:
    name: Consume packed NuGet SDK / linux-x64
    needs: [metadata, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: turboagent-native-nuget
          path: packed
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - name: Install consumer toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Restore exact prerequisite SDKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdk.sh linux-x64 1 1
      - name: Unpack exact-run package
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          test "$(find packed -maxdepth 1 -name '*.nupkg' -type f | wc -l)" -eq 1
          package="packed/TurboAgent.Native.${PACKAGE_VERSION}.nupkg"
          python3 packaging/nuget/verify_exact_package.py "$package" \
            --commit "$GITHUB_SHA" --package-version "$PACKAGE_VERSION"
          mkdir -p "$RUNNER_TEMP/turboagent-consumer-package"
          unzip -q "$package" -d "$RUNNER_TEMP/turboagent-consumer-package"
      - name: Configure and build standalone installed consumer
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/turboagent-consumer-package/sdk/linux-x64"
          # The release SDKs are deliberately NOT inside CMAKE_PREFIX_PATH:
          # bind the exact restored provider roots, avoiding system/source fallback.
          for entry in \
            "SALTS_ROOT:Salts/SaltsConfig.cmake" \
            "SALTS_UTILS_ROOT:SaltsUtils/SaltsUtilsConfig.cmake" \
            "CHTTP_ROOT:Chttp/ChttpConfig.cmake" \
            "TURBOWASM_ROOT:TurboWasm/TurboWasmConfig.cmake" \
            "PRAKTOR_ROOT:Praktor/PraktorConfig.cmake" \
            "TURBOSCRIPT_ROOT:TurboScript/TurboScriptConfig.cmake"; do
            name="${entry%%:*}"
            rel="${entry#*:}"
            root="${!name:?required SDK root is missing: $name}"
            test -f "$root/lib/cmake/$rel" || { echo "missing exact SDK config: $name/$rel" >&2; exit 1; }
          done
          cmake -S packaging/nuget/consumer -B "$RUNNER_TEMP/turboagent-consumer-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_CACHE_REPOSITORY_ROOT/cmake/QigaoVcpkgToolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed/linux" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/vcpkg_installed/linux/x64-linux" \
            -DSalts_DIR="$SALTS_ROOT/lib/cmake/Salts" \
            -DSaltsUtils_DIR="$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils" \
            -DChttp_DIR="$CHTTP_ROOT/lib/cmake/Chttp" \
            -DTurboWasm_DIR="$TURBOWASM_ROOT/lib/cmake/TurboWasm" \
            -DPraktor_DIR="$PRAKTOR_ROOT/lib/cmake/Praktor" \
            -DTurboScript_DIR="$TURBOSCRIPT_ROOT/lib/cmake/TurboScript" \
            -DEXPECTED_WITH_PRAKTOR=ON \
            -DEXPECTED_TURBOAGENT_PREFIX="$prefix"
          cmake --build "$RUNNER_TEMP/turboagent-consumer-build"
          consumer="$RUNNER_TEMP/turboagent-consumer-build/turboagent_installed_consumer"
          test -f "$prefix/lib/libruntime_core.so"
          # Observe the real ELF loader graph and reject unresolved dependencies.
          # Do not inherit a runner-wide LD_LIBRARY_PATH fallback.
          readelf -d "$consumer" | grep -E '(RPATH|RUNPATH)'
          # Explicit deployment paths for direct and transitive DSOs, generated
          # by the standalone consumer from the unpacked exact-run SDK graph.
          loader_path="$(cat "$RUNNER_TEMP/turboagent-consumer-build/runtime-library-path.txt")"
          test -n "$loader_path"
          env LD_LIBRARY_PATH="$loader_path" ldd "$consumer" | tee "$RUNNER_TEMP/turboagent-consumer-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/turboagent-consumer-ldd.txt"; then
            echo "installed consumer has unresolved shared library dependencies" >&2
            exit 1
          fi
          env -u LD_LIBRARY_PATH ctest --test-dir "$RUNNER_TEMP/turboagent-consumer-build" --output-on-failure

  consume-macos:
    name: Consume packed NuGet SDK / macos-arm64
    needs: [metadata, pack]
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: turboagent-native-nuget
          path: packed
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - name: Install consumer toolchain
        shell: bash
        run: brew install ninja nasm
      - name: Restore exact prerequisite SDKs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdk.sh macos-arm64 1 1
      - name: Unpack exact-run package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          test "$(find packed -maxdepth 1 -name '*.nupkg' -type f | wc -l | tr -d ' ')" -eq 1
          package="packed/TurboAgent.Native.${PACKAGE_VERSION}.nupkg"
          python3 packaging/nuget/verify_exact_package.py "$package" \
            --commit "$GITHUB_SHA" --package-version "$PACKAGE_VERSION"
          mkdir -p "$RUNNER_TEMP/turboagent-consumer-package"
          unzip -q "$package" -d "$RUNNER_TEMP/turboagent-consumer-package"
      - name: Configure, link and run installed macOS consumer
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/turboagent-consumer-package/sdk/macos-arm64"
          for entry in \
            "SALTS_ROOT:Salts/SaltsConfig.cmake" \
            "SALTS_UTILS_ROOT:SaltsUtils/SaltsUtilsConfig.cmake" \
            "CHTTP_ROOT:Chttp/ChttpConfig.cmake" \
            "TURBOWASM_ROOT:TurboWasm/TurboWasmConfig.cmake" \
            "PRAKTOR_ROOT:Praktor/PraktorConfig.cmake" \
            "TURBOSCRIPT_ROOT:TurboScript/TurboScriptConfig.cmake"; do
            name="${entry%%:*}"
            rel="${entry#*:}"
            root="${!name:?required SDK root is missing: $name}"
            test -f "$root/lib/cmake/$rel" || { echo "missing exact SDK config: $name/$rel" >&2; exit 1; }
          done
          cmake -S packaging/nuget/consumer -B "$RUNNER_TEMP/turboagent-consumer-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_CACHE_REPOSITORY_ROOT/cmake/QigaoVcpkgToolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DVCPKG_HOST_TRIPLET=arm64-osx \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed/consumer-macos" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/vcpkg_installed/consumer-macos/arm64-osx" \
            -DSalts_DIR="$SALTS_ROOT/lib/cmake/Salts" \
            -DSaltsUtils_DIR="$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils" \
            -DChttp_DIR="$CHTTP_ROOT/lib/cmake/Chttp" \
            -DTurboWasm_DIR="$TURBOWASM_ROOT/lib/cmake/TurboWasm" \
            -DPraktor_DIR="$PRAKTOR_ROOT/lib/cmake/Praktor" \
            -DTurboScript_DIR="$TURBOSCRIPT_ROOT/lib/cmake/TurboScript" \
            -DEXPECTED_WITH_PRAKTOR=ON \
            -DEXPECTED_TURBOAGENT_PREFIX="$prefix"
          cmake --build "$RUNNER_TEMP/turboagent-consumer-build"
          consumer="$RUNNER_TEMP/turboagent-consumer-build/turboagent_installed_consumer"
          test -f "$consumer"
          test -n "$(find "$prefix/lib" -maxdepth 1 -name '*runtime_core*.dylib' -print -quit)"
          file "$consumer"
          otool -L "$consumer"
          otool -l "$consumer" > "$RUNNER_TEMP/turboagent-consumer-otool.txt"
          grep -q LC_RPATH "$RUNNER_TEMP/turboagent-consumer-otool.txt"
          loader_path="$(cat "$RUNNER_TEMP/turboagent-consumer-build/runtime-library-path.txt")"
          test -n "$loader_path"
          # CTest sets only the exact installed provider paths, not ambient dyld paths.
          env -u DYLD_LIBRARY_PATH ctest --test-dir "$RUNNER_TEMP/turboagent-consumer-build" --output-on-failure

  consume-windows:
    name: Consume packed NuGet SDK / windows-x64
    needs: [metadata, pack]
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: turboagent-native-nuget
          path: packed
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - name: Locate MSVC toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw "MSVC x64 toolchain required" }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV
          foreach ($name in @('VCPKG_ROOT', 'VCPKG_CACHE_REPOSITORY_ROOT')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { throw "$name is required" }
            "$name=$($value.Replace('\', '/'))" >> $env:GITHUB_ENV
          }
      - name: Restore exact prerequisite SDKs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cmake/ci/restore-native-sdk.ps1 -Rid windows-x64 -WithWasm
      - name: Unpack exact-run package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem -LiteralPath packed -File -Filter '*.nupkg')
          if ($packages.Count -ne 1) { throw "expected exactly one same-run NuGet archive" }
          $package = "packed/TurboAgent.Native.$($env:PACKAGE_VERSION).nupkg"
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) { throw "missing exact-version package" }
          python packaging/nuget/verify_exact_package.py $package --commit $env:GITHUB_SHA --package-version $env:PACKAGE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "NuGet package provenance check failed" }
          $zip = Join-Path $env:RUNNER_TEMP "turboagent-consumer-package.zip"
          Copy-Item -LiteralPath $package -Destination $zip -Force
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'turboagent-consumer-package') -Force
          $prefix = Join-Path $env:RUNNER_TEMP 'turboagent-consumer-package/sdk/windows-x64'
          foreach ($file in @('lib/cmake/TurboAgent/TurboAgentConfig.cmake', 'turboagent-sdk-manifest.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $prefix $file))) { throw "missing installed SDK file: $file" }
          }
          foreach ($item in @(
            @('SALTS_ROOT', 'Salts'),
            @('SALTS_UTILS_ROOT', 'SaltsUtils'),
            @('CHTTP_ROOT', 'Chttp'),
            @('TURBOWASM_ROOT', 'TurboWasm')
          )) {
            $root = [Environment]::GetEnvironmentVariable($item[0])
            if ([string]::IsNullOrWhiteSpace($root)) { throw "missing exact provider root: $($item[0])" }
            if (-not (Test-Path -LiteralPath (Join-Path $root "lib/cmake/$($item[1])/$($item[1])Config.cmake"))) {
              throw "missing exact provider package config: $($item[1])"
            }
          }
      - name: Configure and link independent MSVC SDK consumer
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cmake -S packaging/nuget/consumer -B "%RUNNER_TEMP%/turboagent-consumer-build" -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_CACHE_REPOSITORY_ROOT%/cmake/QigaoVcpkgToolchain.cmake" ^
            -DVCPKG_TARGET_TRIPLET="%QIGAO_VCPKG_WINDOWS_TRIPLET%" ^
            -DVCPKG_HOST_TRIPLET="%QIGAO_VCPKG_WINDOWS_HOST_TRIPLET%" ^
            -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%/vcpkg_installed/consumer-windows" ^
            -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%/vcpkg_installed/consumer-windows/%QIGAO_VCPKG_WINDOWS_TRIPLET%" ^
            -DSalts_DIR="%SALTS_ROOT%/lib/cmake/Salts" ^
            -DSaltsUtils_DIR="%SALTS_UTILS_ROOT%/lib/cmake/SaltsUtils" ^
            -DChttp_DIR="%CHTTP_ROOT%/lib/cmake/Chttp" ^
            -DTurboWasm_DIR="%TURBOWASM_ROOT%/lib/cmake/TurboWasm" ^
            -DEXPECTED_WITH_PRAKTOR=OFF ^
            -DEXPECTED_TURBOAGENT_PREFIX="%RUNNER_TEMP%/turboagent-consumer-package/sdk/windows-x64"
          if errorlevel 1 exit /b 1
          cmake --build "%RUNNER_TEMP%/turboagent-consumer-build"
          if errorlevel 1 exit /b 1
          dumpbin /dependents "%RUNNER_TEMP%\turboagent-consumer-build\turboagent_installed_consumer.exe"
          if errorlevel 1 exit /b 1
      - name: Run consumer against explicitly deployed Windows SDK DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ctest = (Get-Command ctest).Source
          $prefix = Join-Path $env:RUNNER_TEMP 'turboagent-consumer-package/sdk/windows-x64'
          $triplet = $env:QIGAO_VCPKG_WINDOWS_TRIPLET
          if ([string]::IsNullOrWhiteSpace($triplet)) { throw "Windows vcpkg triplet is missing" }
          $deps = @(
            (Join-Path $prefix 'bin'),
            (Join-Path $env:SALTS_ROOT 'bin'),
            (Join-Path $env:SALTS_UTILS_ROOT 'bin'),
            (Join-Path $env:CHTTP_ROOT 'bin'),
            (Join-Path $env:TURBOWASM_ROOT 'bin'),
            (Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed/consumer-windows/$triplet/bin")
          )
          foreach ($dir in $deps) {
            if (-not (Test-Path -LiteralPath $dir -PathType Container)) { throw "missing explicit DLL deployment directory: $dir" }
          }
          $exe = Join-Path $env:RUNNER_TEMP 'turboagent-consumer-build/turboagent_installed_consumer.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "missing linked consumer executable" }
          # Only exact NuGet/SDK/vcpkg DLL locations plus Windows system DLLs.
          # Do not inherit runner-wide PATH entries that could mask missing packages.
          $env:PATH = (($deps + @("$env:SystemRoot\System32", "$env:SystemRoot")) -join ';')
          & $ctest --test-dir (Join-Path $env:RUNNER_TEMP 'turboagent-consumer-build') --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "installed Windows consumer CTest failed" }

  consume-android:
    name: Cross-link packed NuGet SDK / android-arm64-v8a
    needs: [metadata, pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: turboagent-native-nuget
          path: packed
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - name: Verify Android cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_NDK_HOME:-}"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          sudo apt-get update
          sudo apt-get install -y ninja-build binutils
      - name: Restore exact Android prerequisite SDKs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash cmake/ci/restore-native-sdk.sh android-arm64-v8a 1 1
      - name: Unpack same-run NuGet artifact
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          test "$(find packed -maxdepth 1 -name '*.nupkg' -type f | wc -l)" -eq 1
          package="packed/TurboAgent.Native.${PACKAGE_VERSION}.nupkg"
          python3 packaging/nuget/verify_exact_package.py "$package" \
            --commit "$GITHUB_SHA" --package-version "$PACKAGE_VERSION"
          mkdir -p "$RUNNER_TEMP/turboagent-consumer-package"
          unzip -q "$package" -d "$RUNNER_TEMP/turboagent-consumer-package"
      - name: Cross-configure and link installed Android consumer
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/turboagent-consumer-package/sdk/android-arm64-v8a"
          for entry in \
            "SALTS_ROOT:Salts/SaltsConfig.cmake" \
            "SALTS_UTILS_ROOT:SaltsUtils/SaltsUtilsConfig.cmake" \
            "CHTTP_ROOT:Chttp/ChttpConfig.cmake" \
            "TURBOWASM_ROOT:TurboWasm/TurboWasmConfig.cmake" \
            "PRAKTOR_ROOT:Praktor/PraktorConfig.cmake" \
            "TURBOSCRIPT_ROOT:TurboScript/TurboScriptConfig.cmake"; do
            name="${entry%%:*}"
            rel="${entry#*:}"
            root="${!name:?required Android SDK root missing: $name}"
            test -f "$root/lib/cmake/$rel" || { echo "missing exact Android SDK config: $name/$rel" >&2; exit 1; }
          done
          cmake -S packaging/nuget/consumer -B "$RUNNER_TEMP/turboagent-consumer-android" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_CACHE_REPOSITORY_ROOT/cmake/QigaoVcpkgToolchain.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_HOST_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed/consumer-android" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/vcpkg_installed/consumer-android/arm64-android" \
            -DSalts_DIR="$SALTS_ROOT/lib/cmake/Salts" \
            -DSaltsUtils_DIR="$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils" \
            -DChttp_DIR="$CHTTP_ROOT/lib/cmake/Chttp" \
            -DTurboWasm_DIR="$TURBOWASM_ROOT/lib/cmake/TurboWasm" \
            -DPraktor_DIR="$PRAKTOR_ROOT/lib/cmake/Praktor" \
            -DTurboScript_DIR="$TURBOSCRIPT_ROOT/lib/cmake/TurboScript" \
            -DEXPECTED_WITH_PRAKTOR=ON \
            -DEXPECTED_TURBOAGENT_PREFIX="$prefix"
          cmake --build "$RUNNER_TEMP/turboagent-consumer-android"
          consumer="$RUNNER_TEMP/turboagent-consumer-android/turboagent_installed_consumer"
          test -f "$consumer"
          readelf -h "$consumer" | tee "$RUNNER_TEMP/android-consumer-elf-header.txt"
          grep -Eq 'Machine:[[:space:]]*AArch64' "$RUNNER_TEMP/android-consumer-elf-header.txt"
          readelf -d "$consumer" | grep 'NEEDED'
          echo "Android arm64 installed SDK consumer: CROSS-LINK PASS; no device execution claimed"
