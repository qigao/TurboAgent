name: TurboAgent native SDK release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: read

concurrency:
  group: turboagent-native-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-sdk:
    uses: ./.github/workflows/native-sdk-build.yml

  publish:
    name: Publish package and GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: native-sdk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: turboagent-native-nuget
          path: dist

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Reject unprotected source targets before native SDK publication
        shell: bash
        run: |
          set -euo pipefail
          package="dist/TurboAgent.Native.${{ needs.native-sdk.outputs.version }}.nupkg"
          test -s "$package"
          # This is a product Release admission check on metadata emitted by
          # the real product CMake build, not a Clang version or IR smoke CI.
          # The current unprotected MSVC/GCC/AppleClang presets must fail here
          # until their genuine source-owner protected builds are activated.
          for rid in linux-x64 windows-x64 macos-arm64 android-arm64-v8a; do
            manifest="sdk/$rid/turboagent-sdk-manifest.txt"
            entry="$(unzip -p "$package" "$manifest")" || {
              echo "Unprotected Release denied: missing manifest for $rid" >&2
              exit 1
            }
            if ! grep -Fxq 'source_protection=enabled' <<< "$entry"; then
              echo "Unprotected Release denied: $rid lacks protected source targets" >&2
              exit 1
            fi
          done
          echo 'All published RIDs declare opted-in protected first-party source builds'

      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json             --name github --username qigao --password "$GITHUB_TOKEN"             --store-password-in-clear-text
          dotnet nuget push "dist/TurboAgent.Native.${{ needs.native-sdk.outputs.version }}.nupkg"             --source github --api-key "$GITHUB_TOKEN" --skip-duplicate

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.native-sdk.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          pkg="dist/TurboAgent.Native.$VERSION.nupkg"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$pkg" --repo "$GITHUB_REPOSITORY"               --verify-tag --title "TurboAgent $VERSION" --generate-notes
          fi
