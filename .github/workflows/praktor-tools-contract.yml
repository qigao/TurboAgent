name: Praktor Tools Contract

on:
  pull_request:
    paths:
      - "praktor_tools/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "cmake/TurboAgentConfig.cmake.in"
      - ".github/workflows/praktor-tools-contract.yml"
  push:
    branches:
      - main
    paths:
      - "praktor_tools/**"
      - "CMakeLists.txt"
      - "CMakeOptions.cmake"
      - "cmake/TurboAgentConfig.cmake.in"
      - ".github/workflows/praktor-tools-contract.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Praktor contract sources
        id: contract
        shell: bash
        run: |
          if [[ -f praktor_tools/src/turbo_praktor_tool_pack.c &&
                -f praktor_tools/tests/contract/mock_runtime.c &&
                -f praktor_tools/tests/contract/smoke.c ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Praktor tool-pack sources are not present on this revision; contract gate is inactive."
          fi

      - name: Compile contract smoke
        if: steps.contract.outputs.present == 'true'
        run: |
          cc -std=c11 -D_DEFAULT_SOURCE -Wall -Wextra -Werror \
            -Ipraktor_tools/include \
            -Ipraktor_tools/tests/contract/include \
            praktor_tools/src/turbo_praktor_tool_pack.c \
            praktor_tools/tests/contract/mock_runtime.c \
            praktor_tools/tests/contract/smoke.c \
            -o /tmp/praktor-tools-contract

      - name: Run contract smoke
        if: steps.contract.outputs.present == 'true'
        run: /tmp/praktor-tools-contract
