name: Queued DSO TurboAgent source sanitizer (partial closure)

on:
  pull_request:
    paths:
      - '.github/workflows/queued-dso-source-sanitizers.yml'
      - 'cmake/ci/queued-dso-sanitizer/**'
      - 'praktor_tools/CMakeLists.txt'
      - 'praktor_tools/tests/test_turbo_praktor_dso_compiled_harness.c'
      - 'praktor_tools/tests/praktor_dso_provider.c'
      - 'harness/**'
      - 'runtime_tools/**'
      - 'agent_compiler/**'
      - 'agent/src/turbo_agent_execution.c'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: turboagent-queued-dso-sanitizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  turboagent-source-slice:
    name: TurboAgent source slice / ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]
    env:
      CC: gcc
      CXX: g++
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact source corresponding to pinned Salts SDK
        uses: actions/checkout@v4
        with:
          repository: qigao/salts
          ref: 21bdb1145fbb2b39ee3fa644173ec037adba7b87
          path: salts-source
          persist-credentials: false

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Install Linux C11 / Native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build nasm

      - name: Restore six exact release SDKs with content checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 cmake/ci/queued-dso-sanitizer/restore_exact_sdks.py

      - name: Configure actual TurboAgent first-party targets with sanitizer
        shell: bash
        env:
          KIND: ${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          if [[ "$KIND" == thread ]]; then
            cmake --preset ci-linux-release \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DENABLE_PRAKTOR_TOOLS=ON \
              -DENABLE_SANITIZER_THREAD=ON \
              -DENABLE_SANITIZER_ADDRESS=OFF \
              -DENABLE_SANITIZER_UNDEFINED=OFF
          else
            cmake --preset ci-linux-release \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DENABLE_PRAKTOR_TOOLS=ON \
              -DENABLE_SANITIZER_THREAD=OFF \
              -DENABLE_SANITIZER_ADDRESS=ON \
              -DENABLE_SANITIZER_UNDEFINED=ON
          fi

      - name: Build the actual queued Managed DSO and compiled Harness target
        shell: bash
        run: |
          set -euo pipefail
          cmake --build --preset ci-linux-release \
            --target test_turbo_praktor_dso_compiled_harness --parallel 2

      - name: Verify actual compiled/link-instrumented TurboAgent closure
        shell: bash
        env:
          KIND: ${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          python3 cmake/ci/queued-dso-sanitizer/audit_actual_coverage.py \
            build/ci-linux-release "$GITHUB_WORKSPACE" "$KIND" \
            "$RUNNER_TEMP/queued-dso-exact-sdks/exact-source-and-sdks.json" \
            | tee "build/ci-linux-release/queued-dso-audit.log"
          # This phase is explicitly partial: installed Salts Plugin and
          # ComponentPlugin are NOT first-party instrumented in this binary.

      - name: Execute actual queued DSO callback/cancel under sanitizer
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          ctest --test-dir build/ci-linux-release \
            -R '^test_turbo_praktor_dso_compiled_harness$' \
            --repeat until-fail:10 --output-on-failure

      - name: Preserve exact source coverage and test evidence
        if: always()
        shell: bash
        env:
          KIND: ${{ matrix.sanitizer }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/queued-dso-evidence-$KIND"
          mkdir -p "$dest"
          {
            echo "tested_checkout=$GITHUB_SHA"
            echo "source_head=$SOURCE_HEAD_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "sanitizer=$KIND"
            echo "job_status=$JOB_STATUS"
            echo "upstream_salts_instrumentation=NOT_COVERED_IN_THIS_PROCESS"
          } > "$dest/provenance.txt"
          for entry in \
            "$RUNNER_TEMP/queued-dso-exact-sdks/exact-source-and-sdks.json" \
            build/ci-linux-release/queued_dso_coverage.json \
            build/ci-linux-release/queued-dso-audit.log \
            build/ci-linux-release/praktor_tools/queued_dso_sanitizer.map \
            build/ci-linux-release/Testing/Temporary/LastTest.log \
            build/ci-linux-release/compile_commands.json; do
            if test -f "$entry"; then cp "$entry" "$dest/$(basename "$entry")"; fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queued-dso-source-slice-${{ matrix.sanitizer }}
          path: ${{ runner.temp }}/queued-dso-evidence-${{ matrix.sanitizer }}
          if-no-files-found: error
