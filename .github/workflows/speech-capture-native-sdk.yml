name: TurboAgent Speech Capture Salts native Windows SDK link (#134)

'on':
  pull_request:
    paths:
      - 'speech_input/**'
      - 'CMakeLists.txt'
      - 'cmake/ci/**'
      - '.github/actions/setup-ci-tools/**'
      - '.github/workflows/speech-capture-native-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  installed-windows-capture:
    name: Windows native Salts::Capture SDK opt-in
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SALTS_RELEASE_TAG: v2.3.0-rc.17
      SALTS_UTILS_RELEASE_TAG: v4.3.0-rc.11
      CHTTP_RELEASE_TAG: v2.1.0-rc.6
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - name: Select Windows llvm-mingw UCRT
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@1360926924904fdc9f13767885cea5bde50a7887
        with:
          version: "20261020"
          target: x64
          build-type: toolchain-only
      - name: Normalize source/toolchain paths for CMake
        shell: pwsh
        run: |
          foreach ($name in @('VCPKG_ROOT','VCPKG_CACHE_REPOSITORY_ROOT','RE2C_ROOT')) {
            $path = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($path)) { throw "$name required" }
            "$name=$($path.Replace('\','/'))" >> $env:GITHUB_ENV
          }
          "CC=$env:LLVM_MINGW_CC" >> $env:GITHUB_ENV
          "CXX=$env:LLVM_MINGW_CXX" >> $env:GITHUB_ENV
      - name: Restore official native Salts/SaltsUtils/CHttp Windows SDKs
        shell: bash
        run: bash cmake/ci/restore-native-sdk.sh windows-x64 0 0
      - name: Require actual installed Salts::Capture native target and compile adapter
        shell: cmd
        run: |
          python cmake/ci/restore-vcpkg-cache.py ci-windows-release
          if errorlevel 1 exit /b 1
          cmake --preset ci-windows-release -DVCPKG_INSTALL_OPTIONS=--only-binarycaching -DENABLE_SPEECH_INPUT=ON -DENABLE_SPEECH_CAPTURE_BRIDGE=ON -DENABLE_SPEECH_CAPTURE_NATIVE=ON -DENABLE_WASM_TOOLS=OFF -DENABLE_PRAKTOR_TOOLS=OFF -DENABLE_CODING_TOOLS=OFF -DENABLE_CODEX_BRIDGE=OFF -DENABLE_MCP_TOOLS=OFF -DBUILD_TESTS=ON
          if errorlevel 1 exit /b 1
          cmake --build --preset ci-windows-release
          if errorlevel 1 exit /b 1
          ctest --test-dir build/ci-windows-release -C Release --no-tests=error -R "^turbo_agent_speech_capture_bridge_core$" --output-on-failure --timeout 30
      - name: Require feature/owner metadata without starting a microphone
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cache = Get-Content 'build/ci-windows-release/CMakeCache.txt' -Raw
          foreach ($flag in @('ENABLE_SPEECH_INPUT:BOOL=ON','ENABLE_SPEECH_CAPTURE_BRIDGE:BOOL=ON','ENABLE_SPEECH_CAPTURE_NATIVE:BOOL=ON')) {
            if (-not $cache.Contains($flag)) { throw "Feature flag not active: $flag" }
          }
          $library = Get-ChildItem 'build/ci-windows-release' -Recurse -File |
            Where-Object { $_.Name -eq 'libturbo_agent_speech_capture_salts.a' } |
            Select-Object -First 1
          if (-not $library) { throw 'Missing native Salts Capture adapter archive' }
          Get-FileHash -Path $library.FullName -Algorithm SHA256 | Format-List | Out-String | Write-Host
          "PASS: native Salts::Capture exactly imported, compiled, linked and no real microphone opened" |
            Tee-Object -FilePath "$env:RUNNER_TEMP\speech-capture-windows.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speech-capture-salts-windows-native-evidence
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/speech-capture-windows.txt
