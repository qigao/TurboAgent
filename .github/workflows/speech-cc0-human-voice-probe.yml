name: Speech M3 licensed human voice predecode characterization (#146)

'on':
  pull_request:
    paths:
      - '.github/workflows/speech-cc0-human-voice-probe.yml'
      - 'speech_input/whisper/tools/stress_stationarity_human.py'
      - 'speech_input/whisper/tools/tests/test_stress_stationarity_human.py'

permissions:
  contents: read

jobs:
  japanese-cc0-voice-no-model:
    if: github.event.pull_request.head.repo.full_name == 'qigao/TurboAgent' && github.event.pull_request.head.ref == 'test/speech-cc0-voice-probe-146'
    name: Independently pinned Japanese CC0 voice, Guard OFF/ON (no weights)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install only CPU audio-decoding dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
      - name: Verify exact original CC0 Ogg, normalize privately and report only numeric admission
        shell: bash
        env:
          CC0_URL: https://upload.wikimedia.org/wikipedia/commons/b/b9/%E6%98%A5%E3%81%AF%E3%81%82%E3%81%91%E3%81%BC%E3%81%AE.ogg
          CC0_EXPECTED_SHA1: c7992ec2188ee94102f83e4eff22c4f9b9365d39
          CC0_EXPECTED_SHA256: cad2f1545a3ac898362590ea636b8c09f1d77391b506790ae909e0e1ff1441f7
          CC0_EXPECTED_BYTES: '264858'
        run: |
          set -euo pipefail
          umask 077
          private_dir="$(mktemp -d "${RUNNER_TEMP}/cc0-human-voice-XXXXXX")"
          chmod 700 "$private_dir"
          trap 'rm -rf -- "$private_dir"' EXIT

          source="$private_dir/ja-commons-original.ogg"
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 15 --max-time 60 --max-filesize 500000 \
            --proto '=https' --proto-redir '=https' \
            --user-agent 'TurboAgent-CC0-voice-test/1.0 (qigao/TurboAgent)' \
            "$CC0_URL" --output "$source"
          test "$(wc -c < "$source" | tr -d '[:space:]')" = "$CC0_EXPECTED_BYTES"
          actual_sha1="$(sha1sum "$source" | awk '{print $1}')"
          test "$actual_sha1" = "$CC0_EXPECTED_SHA1"
          original_sha256="$(sha256sum "$source" | awk '{print $1}')"
          # A second independent run must consume the *same* immutable
          # original bytes as the first confirmed human-voice observation.
          test "$original_sha256" = "$CC0_EXPECTED_SHA256"

          ffmpeg_bin="$(realpath "$(command -v ffmpeg)")"
          ffmpeg_sha256="$(sha256sum "$ffmpeg_bin" | awk '{print $1}')"
          python3 speech_input/whisper/tools/prepare_stationarity_wav.py \
            --source "$source" --source-sha256 "$original_sha256" \
            --ffmpeg "$ffmpeg_bin" --ffmpeg-sha256 "$ffmpeg_sha256" \
            --output-wav "$private_dir/japanese.wav" \
            --private-provenance "$private_dir/japanese.private.json" \
            --acknowledge-rights > "$private_dir/preflight.stdout.json"

          CC0_PRIVATE_DIR="$private_dir" CC0_SOURCE_SHA256="$original_sha256" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          folder = Path(os.environ['CC0_PRIVATE_DIR'])
          sidecar = json.loads((folder / 'japanese.private.json').read_text())
          manifest = {
              "schema": 2,
              "samples": [{
                  "path": "japanese.wav",
                  "sha256": sidecar["normalized_wav_sha256"],
                  "source_kind": "human_voice",
                  "language": "ja",
                  "condition": "ordinary",
                  "rights_basis": "public_license",
                  "speaker_group": "source_ja_cc0_public",
              }]
          }
          manifest_file = folder / "manifest.private.json"
          manifest_file.write_text(json.dumps(manifest), encoding="utf-8")
          os.chmod(manifest_file, 0o600)
          # Keep the only output strictly numerical/source-provenance. No
          # raw audio, transcript, clip path or private speaker-group key.
          sys.path.insert(0, "speech_input/whisper/tools")
          from evaluate_stationarity_corpus import evaluate
          result = evaluate(folder, manifest_file)
          counts = result["human_voice"]
          assert result["sample_count"] == 1
          assert counts["guard_off_rejections"] == 0
          assert counts["guard_on_rejections"] in (0, 1)
          assert result["model_inference_used"] is False
          assert result["speaker_independence_verified"] is False
          print(json.dumps({
              "evidence_kind": "independent_real_human_licensed_source",
              "source_url": "https://commons.wikimedia.org/wiki/File:%E6%98%A5%E3%81%AF%E3%81%82%E3%81%91%E3%81%BC%E3%81%AE.ogg",
              "source_revision": "current-upload-2019-03-12",
              "source_sha1_verification": "PASS",
              "original_sha256": os.environ["CC0_SOURCE_SHA256"],
              "canonical_wav_sha256": sidecar["normalized_wav_sha256"],
              "language": "ja",
              "human_clip_count": 1,
              "declared_speaker_count": 1,
              "predecode_guard_off_rejections": counts["guard_off_rejections"],
              "predecode_guard_on_rejections": counts["guard_on_rejections"],
              "predecode_guard_on_false_rejection_fraction": counts[
                  "guard_on_false_rejection"]["rate"],
              "frames": sidecar["frames"],
              "model_weights_used": False,
              "wer_cer_measured": False,
              "noise_hallucinations_measured": False,
              "speaker_population_coverage_certified": False,
              "no_audio_or_transcript_artifact": True,
          }, ensure_ascii=False, sort_keys=True))
          PY

          # Deliberate *source-derived* audio transformation: gain-only
          # attenuation and per-frame RMS equalization. The latter splices
          # nonzero 20-ms frames and is NOT natural, intelligibility-proven
          # low-volume/monotone human speech. Only numeric report is logged.
          STRESS_WAV="$private_dir/japanese.wav" \
          STRESS_META="$private_dir/japanese.private.json" \
          STRESS_LANG="ja" \
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, "speech_input/whisper/tools")
          from stress_stationarity_human import evaluate_bytes
          wave = Path(os.environ["STRESS_WAV"]).read_bytes()
          sha = json.loads(Path(os.environ["STRESS_META"]).read_text())[
              "normalized_wav_sha256"]
          result = evaluate_bytes(wave, sha)
          control = result["controlled_energy_equalization"]
          assert control["selected_nonzero_source_frames"] >= 50
          assert control["guard_on_predecode_no_speech"] is True
          assert control["guard_off_predecode_no_speech"] is False
          assert result["actual_whisper_model_used"] is False
          assert result["actual_c11_provider_used_on_source_audio"] is False
          print(json.dumps({
              "evidence_kind": "derived_from_verified_real_spoken_source",
              "language": os.environ["STRESS_LANG"],
              **result,
          }, sort_keys=True))
          PY

          # No upload-artifact action. All clip/manifest/provenance bytes
          # remain in RUNNER_TEMP until trap cleanup; no model download.

