name: TurboAgent SpeechInput opt-in installed SDK C11/C++17 (#134)

'on':
  pull_request:
    paths:
      - 'speech_input/**'
      - 'CMakeLists.txt'
      - 'cmake/ci/**'
      - '.github/actions/setup-ci-tools/**'
      - '.github/workflows/speech-input-installed-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  installed-native-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SALTS_RELEASE_TAG: v2.3.0-rc.17
      SALTS_UTILS_RELEASE_TAG: v4.3.0-rc.11
      CHTTP_RELEASE_TAG: v2.1.0-rc.6
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      TA_SPEECH_INSTALLED: /tmp/ta-speech-m1-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-tools
      - name: Select installed Linux LLVM/Clang
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-native@35dc0f8ac0c7e880a5126fac516d7258b6fea15b
        with:
          build-type: toolchain-only
      - name: Install exact native Linux tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build nasm pkg-config
      - name: Restore currently published Salts, SaltsUtils and CHttp SDK roots
        shell: bash
        run: |
          set -euo pipefail
          bash cmake/ci/restore-native-sdk.sh linux-x64 0 0
      - name: Build explicit SpeechInput opt-in native consumer profile
        shell: bash
        run: |
          set -euo pipefail
          python cmake/ci/restore-vcpkg-cache.py ci-linux-release
          cmake --preset ci-linux-release -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DENABLE_SPEECH_INPUT=ON \
            -DENABLE_PRAKTOR_TOOLS=OFF -DENABLE_WASM_TOOLS=OFF \
            -DENABLE_CODING_TOOLS=OFF -DENABLE_CODEX_BRIDGE=OFF \
            -DENABLE_MCP_TOOLS=OFF \
            "-DCMAKE_INSTALL_PREFIX=$TA_SPEECH_INSTALLED"
          grep -Fx 'ENABLE_SPEECH_INPUT:BOOL=ON' \
            build/ci-linux-release/CMakeCache.txt
          cmake --build --preset ci-linux-release --parallel 2
          ctest --test-dir build/ci-linux-release --no-tests=error \
            -R '^turbo_agent_speech_input_' --output-on-failure --timeout 30
          cmake --install build/ci-linux-release --prefix "$TA_SPEECH_INSTALLED"
          test -f "$TA_SPEECH_INSTALLED/include/turbo_agent_speech_input.h"
          test -f "$TA_SPEECH_INSTALLED/lib/libturbo_agent_speech_input.a"
          test -f "$TA_SPEECH_INSTALLED/lib/cmake/TurboAgent/TurboAgentTargets.cmake"
          sha256sum "$TA_SPEECH_INSTALLED/lib/libturbo_agent_speech_input.a" \
            | tee "$RUNNER_TEMP/ta-speech-m1-installed.sha256"
      - name: Independent installed-only C11 and C++17 link plus execute
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ta-speech-consumer"
          mkdir -p "$root"
          cat > "$root/c11.c" <<'C11'
          #include <turbo_agent_speech_input.h>
          int main(void) {
            turbo_agent_speech_config_t config;
            turbo_agent_speech_config_init(&config);
            return config.abi_version != TURBO_AGENT_SPEECH_INPUT_ABI_VERSION;
          }
          C11
          cat > "$root/cpp17.cpp" <<'CPP'
          #include <turbo_agent_speech_input.h>
          #include <type_traits>
          static_assert(std::is_standard_layout<turbo_agent_speech_provider_v1_t>::value,
                        "The public Provider ABI remains standard layout");
          int main() {
            turbo_agent_speech_provider_v1_t provider{};
            turbo_agent_speech_provider_v1_init(&provider);
            return provider.abi_version != TURBO_AGENT_SPEECH_INPUT_ABI_VERSION;
          }
          CPP
          cat > "$root/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.25)
          project(ExternalSpeechInstalledConsumer LANGUAGES C CXX)
          set(CMAKE_C_STANDARD 11)
          set(CMAKE_CXX_STANDARD 17)
          find_package(TurboAgent CONFIG REQUIRED
            PATHS "$ENV{TA_SPEECH_INSTALLED}" NO_DEFAULT_PATH)
          if(NOT TARGET TurboAgent::SpeechInput)
            message(FATAL_ERROR "Missing installed opt-in SpeechInput target")
          endif()
          add_executable(speech_c11 c11.c)
          add_executable(speech_cpp17 cpp17.cpp)
          target_link_libraries(speech_c11 PRIVATE TurboAgent::SpeechInput)
          target_link_libraries(speech_cpp17 PRIVATE TurboAgent::SpeechInput)
          enable_testing()
          add_test(NAME installed_speech_c11 COMMAND speech_c11)
          add_test(NAME installed_speech_cpp17 COMMAND speech_cpp17)
          CMAKE
          cmake -S "$root" -B "$root/build" -G Ninja \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            "-DCMAKE_C_COMPILER=$LLVM_NATIVE_CC" "-DCMAKE_CXX_COMPILER=$LLVM_NATIVE_CXX" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DVCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed/ci-linux-release" \
            "-DCMAKE_PREFIX_PATH=$TA_SPEECH_INSTALLED;$SALTS_ROOT;$SALTS_UTILS_ROOT;$CHTTP_ROOT;$GITHUB_WORKSPACE/vcpkg_installed/ci-linux-release/x64-linux"
          cmake --build "$root/build" --parallel 2
          ctest --test-dir "$root/build" --no-tests=error --output-on-failure
          echo "PASS: installed TurboAgent::SpeechInput C11/C++17 with no source-tree target" \
            | tee "$RUNNER_TEMP/ta-speech-m1-consumer.txt"
      - name: Preserve installed consumer provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speech-m1-installed-sdk-consumer
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ta-speech-m1-installed.sha256
            ${{ runner.temp }}/ta-speech-m1-consumer.txt
            build/ci-linux-release/Testing/Temporary/LastTest.log
