name: Speech NS isolated SpeexDSP C11 candidate (#146)

'on':
  pull_request:
    paths:
      - 'speech_input/noise_lab/**'
      - '.github/workflows/speech-speexdsp-ns-lab.yml'

permissions:
  contents: read

jobs:
  speexdsp-native-c11:
    if: github.event.pull_request.head.repo.full_name == 'qigao/TurboAgent' && (github.event.pull_request.head.ref == 'test/speech-speexdsp-c11-ns-146' || github.event.pull_request.head.ref == 'test/speech-speexdsp-mixed-reference-167' || github.event.pull_request.head.ref == 'test/speech-speexdsp-noise-level-sweep-167' || github.event.pull_request.head.ref == 'test/speech-speexdsp-paired-asr-offline-167' || github.event.pull_request.head.ref == 'test/speech-speexdsp-atomic-paired-wavs-167' || github.event.pull_request.head.ref == 'test/speech-speexdsp-recorded-road-mix-167')
    name: SpeexDSP-1.2.1 C11 NS-only smoke, native source + licensed audio
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install reviewed distro SpeexDSP native headers and CPU decoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libspeexdsp-dev pkg-config ninja-build ffmpeg
          test "$(pkg-config --modversion speexdsp)" = 1.2.1
          dpkg-query -W -f='speexdsp-pkg=${Version}\n' libspeexdsp-dev
          test "$(dpkg-query -W -f='${Version}' libspeexdsp-dev)" = '1.2.1-1ubuntu3'
          speex_lib="$(readlink -f "$(pkg-config --variable=libdir speexdsp)/libspeexdsp.so")"
          test -f "$speex_lib"
          sha256sum "$speex_lib"
          test "$(sha256sum "$speex_lib" | awk '{print $1}')" = \
            ef4e0d1c80fb4fcf832bb98be7df08b44faaed84ee2c003070fa1b1023a1c5fd
          pkg-config --cflags --libs speexdsp
          # Distro package build itself is not compiled with our sanitizers;
          # only the test-only strict C11 owner and harness are instrumented.
      - name: Build independent strict C11 owner and test exact capacity/replay
        shell: bash
        run: |
          set -euo pipefail
          cmake -S speech_input/noise_lab -B build/speex-ns-lab -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build/speex-ns-lab --parallel 2
          ctest --test-dir build/speex-ns-lab --output-on-failure
          cmake -S speech_input/noise_lab -B build/speex-ns-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            "-DCMAKE_C_FLAGS=-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          cmake --build build/speex-ns-sanitized --parallel 2
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir build/speex-ns-sanitized --output-on-failure
      - name: Test metadata-only PCM A/B metrics and private SHA handling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s speech_input/noise_lab/tools/tests \
            -p 'test_*.py' -v
      - name: Prove fail-closed private model/CLI/WAV gates and transcript-free paired CER/WER accounting
        shell: bash
        run: |
          set -euo pipefail
          # The test model and C11 transcripts are mocked strictly inside
          # unit tests. This job MUST NOT download or open any real weights.
          python3 -m unittest discover \
            -s speech_input/noise_lab/tools/tests \
            -p 'test_evaluate_whisper_paired.py' -v
      - name: Compare synthetic stationary noise, real whisper and real road noise NS
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$(mktemp -d "$RUNNER_TEMP/speex-ns-private-XXXXXX")"
          chmod 700 "$root"
          trap 'rm -rf -- "$root"' EXIT
          # Wikimedia public CC0 (whisper, Mx. Granger) and CC BY-SA 4.0
          # (recycling-truck warning, Ke4roh) previously source-pinned in
          # #158/#155; never infer voice absence from NS-only output.
          for case in whisper road; do
            if [ "$case" = whisper ]; then
              url='https://upload.wikimedia.org/wikipedia/commons/e/e8/Whispering-example.ogg'
              sha='bbdbe95dfe4742e27845c03fba3a8caf9f0f5ad65e34e512fd5609d155e6304e'
              bytes=30283
            else
              url='https://upload.wikimedia.org/wikipedia/commons/e/e2/Back-up_white_noise.ogg'
              sha='7d70594ef7ba1bd7a34136ab7140420d016fd730acc6c124a1a02fe6c75337d0'
              bytes=120796
            fi
            curl --fail --location --silent --show-error --retry 2 \
              --connect-timeout 15 --max-time 60 --max-filesize 300000 \
              --proto '=https' --proto-redir '=https' \
              --user-agent 'TurboAgent-SpeexDSP-NS-study/1.0 (qigao/TurboAgent)' \
              "$url" --output "$root/$case-original.ogg"
            test "$(wc -c < "$root/$case-original.ogg" | tr -d '[:space:]')" = "$bytes"
            test "$(sha256sum "$root/$case-original.ogg" | awk '{print $1}')" = "$sha"
            ffmpeg="$(realpath "$(command -v ffmpeg)")"
            ffmpeg_sha="$(sha256sum "$ffmpeg" | awk '{print $1}')"
            python3 speech_input/whisper/tools/prepare_stationarity_wav.py \
              --source "$root/$case-original.ogg" --source-sha256 "$sha" \
              --ffmpeg "$ffmpeg" --ffmpeg-sha256 "$ffmpeg_sha" \
              --output-wav "$root/$case.wav" \
              --private-provenance "$root/$case.provenance.json" \
              --acknowledge-rights > "$root/$case.private-status"
          done
          RAW_ROOT="$root" python3 - <<'PY'
          from pathlib import Path
          import os, random, struct, wave
          root = Path(os.environ['RAW_ROOT'])
          for name in ('whisper','road'):
              with wave.open(str(root/(name+'.wav')),'rb') as wav:
                  assert (wav.getframerate(), wav.getsampwidth(), wav.getnchannels()) == (16000,2,1)
                  frames = wav.getnframes()
                  assert 0 < frames <= 960000 and frames % 320 == 0
                  pcm = wav.readframes(frames)
              (root/(name+'.raw')).write_bytes(pcm)
          # Controlled constant-level broadband S16 noise, exactly 4 sec.
          rng = random.Random(20261015)
          with (root/'steady.raw').open('wb') as out:
              for _ in range(16000*4):
                  out.write(struct.pack('<h', rng.randint(-1000,1000)))
          PY

          probe="$GITHUB_WORKSPACE/build/speex-ns-lab/ta_speex_ns_raw_probe"
          for sample in steady whisper road; do
            for db in -12 -18; do
              "$probe" "$root/$sample.raw" "$root/$sample.$db.raw" "$db"
              "$probe" "$root/$sample.raw" \
                "$root/$sample.$db.aligned.raw" "$db" --align-one-frame
              python3 speech_input/noise_lab/tools/evaluate_ns_pcm_pair.py \
                --before "$root/$sample.raw" \
                --before-sha256 "$(sha256sum "$root/$sample.raw" | awk '{print $1}')" \
                --after "$root/$sample.$db.aligned.raw" \
                --after-sha256 "$(sha256sum "$root/$sample.$db.aligned.raw" | awk '{print $1}')" \
                --kind "$sample" --db "$db"
              # Gate the same licensed WAV bytes before and after an
              # explicitly compensated 20ms flush; this is NOT WER/CER.
              CHECK_DIR="$root" CHECK_SAMPLE="$sample" CHECK_DB="$db" python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "speech_input/noise_lab/tools")
          from evaluate_ns_pcm_pair import evaluate
          root=Path(os.environ["CHECK_DIR"])
          name=os.environ["CHECK_SAMPLE"]; db=int(os.environ["CHECK_DB"])
          before=(root/(name+".raw")).read_bytes()
          aligned=(root/(name+"."+str(db)+".aligned.raw")).read_bytes()
          report=evaluate(before, aligned, name, db)
          assert report["best_bounded_alignment_shift_samples"] == 0
          assert report["undelivered_tail_samples_if_no_flush"] == 0
          assert report["frames"] == len(before)//640
          assert report["no_speech_decision_authorized"] is False
          if name == "steady":
              assert report["energy_ratio"] < 0.5
          if name == "whisper":
              assert report["aligned_cosine_similarity"] > 0.99
              assert report["guard_after_ns_20ms_stationarity"] == "dynamic_or_unknown"
              assert report["after_power"] > 0
          if name == "road":
              assert report["guard_after_ns_20ms_stationarity"] == "dynamic_or_unknown"
          PY
              python3 speech_input/noise_lab/tools/evaluate_ns_pcm_pair.py \
                --before "$root/$sample.raw" \
                --before-sha256 "$(sha256sum "$root/$sample.raw" | awk '{print $1}')" \
                --after "$root/$sample.$db.raw" \
                --after-sha256 "$(sha256sum "$root/$sample.$db.raw" | awk '{print $1}')" \
                --kind "$sample" --db "$db"
              RAW_ROOT="$root" PCM_KIND="$sample" PCM_DB="$db" python3 - <<'PY'
          from pathlib import Path
          import json, os, struct
          root = Path(os.environ['RAW_ROOT'])
          kind = os.environ['PCM_KIND']; db = os.environ['PCM_DB']
          before = (root/(kind+'.raw')).read_bytes()
          after = (root/(kind+'.'+db+'.raw')).read_bytes()
          assert len(before) == len(after) and len(before)>0
          assert len(after) % 640 == 0 and len(after) <= 1920000
          a = struct.unpack('<%dh' % (len(before)//2), before)
          b = struct.unpack('<%dh' % (len(after)//2), after)
          before_energy = sum(x*x for x in a)
          after_energy = sum(x*x for x in b)
          modified = sum(x != y for x,y in zip(a,b))
          assert before_energy > 0
          assert modified > 0
          if kind == "whisper":
              assert after_energy > 0  # no all-zero mute of real human input
          print(json.dumps({
              "signal":kind,
              "noise_suppress_db":int(db),
              "source_type":"synthetic_noise" if kind=="steady" else
                  "real_licensed_voice" if kind=="whisper" else "real_licensed_road_noise",
              "frame_count":len(a)//320,
              "raw_pcm_energy":before_energy,
              "processed_pcm_energy":after_energy,
              "energy_ratio":round(after_energy/before_energy,6),
              "changed_samples":modified,
              "nonzero_processed":sum(x!=0 for x in b),
              "asr_accuracy_or_hallucinations_measured":False,
              "speech_intelligibility_certified":False,
              "model_weights_downloaded":False,
              "audio_artifacts_uploaded":False,
          }, sort_keys=True))
          PY
            done
          done
          # Separately controlled speech-plus-known-noise reference:
          # original genuine licensed whisper + precisely generated noise
          # and one extra second of noise-only adaptation. Never infer
          # acoustic recognition quality from this signal-to-error proxy.
          mkdir -m 700 "$root/known"
          python3 speech_input/noise_lab/tools/known_noise_reference.py prepare \
            --source-raw "$root/whisper.raw" \
            --source-sha256 "$(sha256sum "$root/whisper.raw" | awk '{print $1}')" \
            --private-root "$root/known"
          for db in -12 -18; do
            "$probe" "$root/known/mixed-known-noise.raw" \
              "$root/known/mixed-processed-$db.raw" "$db" --align-one-frame
            python3 speech_input/noise_lab/tools/known_noise_reference.py score \
              --clean "$root/known/clean-reference.raw" \
              --clean-sha256 "$(sha256sum "$root/known/clean-reference.raw" | awk '{print $1}')" \
              --mixed "$root/known/mixed-known-noise.raw" \
              --mixed-sha256 "$(sha256sum "$root/known/mixed-known-noise.raw" | awk '{print $1}')" \
              --filtered "$root/known/mixed-processed-$db.raw" \
              --filtered-sha256 "$(sha256sum "$root/known/mixed-processed-$db.raw" | awk '{print $1}')"
          done
          # Same clean licensed whisper, three additional bounded noise
          # amplitudes; no automatic "best setting" claim without WER/CER.
          for peak in 100 200 800; do
            mkdir -m 700 "$root/known-$peak"
            python3 speech_input/noise_lab/tools/known_noise_reference.py prepare \
              --source-raw "$root/whisper.raw" \
              --source-sha256 "$(sha256sum "$root/whisper.raw" | awk '{print $1}')" \
              --private-root "$root/known-$peak" --noise-peak "$peak"
            for db in -12 -18; do
              "$probe" "$root/known-$peak/mixed-known-noise.raw" \
                "$root/known-$peak/mixed-processed-$db.raw" "$db" --align-one-frame
              python3 speech_input/noise_lab/tools/known_noise_reference.py score \
                --clean "$root/known-$peak/clean-reference.raw" \
                --clean-sha256 "$(sha256sum "$root/known-$peak/clean-reference.raw" | awk '{print $1}')" \
                --mixed "$root/known-$peak/mixed-known-noise.raw" \
                --mixed-sha256 "$(sha256sum "$root/known-$peak/mixed-known-noise.raw" | awk '{print $1}')" \
                --filtered "$root/known-$peak/mixed-processed-$db.raw" \
                --filtered-sha256 "$(sha256sum "$root/known-$peak/mixed-processed-$db.raw" | awk '{print $1}')"
            done
          done
          # Automatic fair three-arm preparation on ONE original approved
          # CC0 whisper, with the same tested native C11 SpeexDSP executable.
          # All WAVs/RAW/provenance remain in ephemeral 0700 private root.
          mkdir -m 700 "$root/paired-wavs"
          python3 speech_input/noise_lab/tools/prepare_paired_asr_wavs.py \
            --source-wav "$root/whisper.wav" \
            --source-sha256 "$(sha256sum "$root/whisper.wav" | awk '{print $1}')" \
            --ns-probe "$probe" \
            --ns-probe-sha256 "$(sha256sum "$probe" | awk '{print $1}')" \
            --private-root "$root/paired-wavs"
          PAIRED_ROOT="$root/paired-wavs" NS_ROOT="$root" python3 - <<'PY'
          import hashlib, io, json, os, wave
          from pathlib import Path
          root = Path(os.environ["PAIRED_ROOT"])
          source_dir = Path(os.environ["NS_ROOT"])
          data = json.loads((root/"paired-private.json").read_text())
          assert data["frame_count"] == 128
          assert data["sample_rate"] == 16000
          assert data["frame_samples"] == 320
          assert data["model_weights_or_inference_used"] is False
          assert data["ns_configuration"]["VAD"] is False
          assert data["ns_configuration"]["AGC"] is False
          for arm in ("original","ns12","ns18"):
              source = root/(arm+".wav")
              assert hashlib.sha256(source.read_bytes()).hexdigest() == (
                  data["wavs"][arm]["sha256"])
              with wave.open(str(source),"rb") as wav:
                  assert (wav.getframerate(),wav.getnchannels(),
                          wav.getsampwidth(),wav.getnframes()) == (16000,1,2,128*320)
                  pcm = wav.readframes(wav.getnframes())
              if arm == "original":
                  assert source.read_bytes() == (source_dir/"whisper.wav").read_bytes()
              else:
                  db = -12 if arm == "ns12" else -18
                  assert pcm == (source_dir/("whisper."+str(db)+".aligned.raw")).read_bytes()
          assert sorted(item.name for item in root.iterdir()) == sorted([
              "original.wav","ns12.wav","ns18.wav","paired-private.json"])
          print(json.dumps({
              "test_kind":"exact_same_real_whisper_three_arm_C11_SpeexDSP",
              "arms":3,
              "frames_each":128,
              "source_pcm_identical":True,
              "ns12_matches_native_aligned_output":True,
              "ns18_matches_native_aligned_output":True,
              "raw_transient_left_in_private_directory":False,
              "model_weights_or_asr_used":False,
              "actual_acoustic_wer_cer_measured":False
          },sort_keys=True))
          PY
          # Actual independently recorded vehicle warning waveform is
          # overlaid IN SOFTWARE on previously licensed English whisper.
          # It is NOT a genuine simultaneous voice+ambient mic capture.
          # The recorded field-noise source is SHA-pinned above (#155).
          for divisor in 8 16; do
            mkdir -m 700 "$root/roadmix-$divisor"
            python3 speech_input/noise_lab/tools/mix_recorded_field_noise.py prepare \
              --clean-raw "$root/whisper.raw" \
              --clean-sha256 "$(sha256sum "$root/whisper.raw" | awk '{print $1}')" \
              --recorded-noise-raw "$root/road.raw" \
              --recorded-noise-sha256 "$(sha256sum "$root/road.raw" | awk '{print $1}')" \
              --scale-divisor "$divisor" \
              --private-root "$root/roadmix-$divisor"
            for db in -12 -18; do
              "$probe" "$root/roadmix-$divisor/mixed-recorded-road.raw" \
                "$root/roadmix-$divisor/processed-$db.raw" \
                "$db" --align-one-frame
              python3 speech_input/noise_lab/tools/mix_recorded_field_noise.py score \
                --clean "$root/roadmix-$divisor/clean-reference.raw" \
                --clean-sha256 "$(sha256sum "$root/roadmix-$divisor/clean-reference.raw" | awk '{print $1}')" \
                --mixed "$root/roadmix-$divisor/mixed-recorded-road.raw" \
                --mixed-sha256 "$(sha256sum "$root/roadmix-$divisor/mixed-recorded-road.raw" | awk '{print $1}')" \
                --filtered "$root/roadmix-$divisor/processed-$db.raw" \
                --filtered-sha256 "$(sha256sum "$root/roadmix-$divisor/processed-$db.raw" | awk '{print $1}')" \
                --scale-divisor "$divisor"
            done
          done
          # No upload-artifact action. WAV/raw/provenance wiped on exit.
