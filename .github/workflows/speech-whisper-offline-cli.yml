name: SpeechWhisper offline WAV CLI real CPU and mock positive (#137)

'on':
  pull_request:
    paths:
      - 'speech_input/whisper/tools/**'
      - 'speech_input/whisper/CMakeLists.txt'
      - '.github/workflows/speech-whisper-offline-cli.yml'
      - 'speech_input/noise_lab/tools/run_three_arm_native_c11_ci.sh'
      - 'speech_input/noise_lab/tools/prepare_paired_asr_wavs.py'
      - 'speech_input/noise_lab/tools/run_multilingual_three_arm_c11_ci.sh'
      - 'speech_input/noise_lab/tools/run_recorded_road_native_c11_ci.sh'
      - 'speech_input/noise_lab/tools/run_three_arm_native_c11_ci.sh'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  asr-metrics-no-weights:
    name: Offline zh/ja CER and en WER evaluator (no model download)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install local CPU FFmpeg for genuine pipe-only normalization smoke
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          ffmpeg -version | head -n 1
      - name: Test deterministic multilingual scoring and fail-closed transcript admission
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s speech_input/whisper/tools/tests \
            -p 'test_*.py' -v

  real-whisper-binary-and-mock-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SALTS_ROOT: /tmp/speech-cli-salts/sdk/linux-x64
      TURBO_WHISPER_SDK_ROOT: /tmp/speech-cli-whisper-sdk
      MODEL_FIXTURES: /tmp/speech-cli-fixtures
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: d1be6fde11ac6e0407606b4e42fe72d34add8037
          path: external/whisper-v195
          submodules: recursive
          persist-credentials: false
      - name: Pin native Whisper API, published Salts crypto and CLI fixture provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/whisper-v195 rev-parse HEAD)" = d1be6fde11ac6e0407606b4e42fe72d34add8037
          mkdir -p /tmp/speech-cli-salts "$TURBO_WHISPER_SDK_ROOT" "$MODEL_FIXTURES"
          test "$(gh api repos/qigao/salts/git/ref/tags/v2.3.0-rc.16 --jq .object.sha)" = 6cf093dc053db98bb21b1788eb2fc1ada4df195e
          gh release download v2.3.0-rc.16 --repo qigao/salts \
            --pattern Salts.Native.2.3.0-rc.16.nupkg \
            --dir /tmp/speech-cli-salts
          unzip -q /tmp/speech-cli-salts/Salts.Native.2.3.0-rc.16.nupkg \
            -d /tmp/speech-cli-salts
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          sha256sum /tmp/speech-cli-salts/Salts.Native.2.3.0-rc.16.nupkg \
            > /tmp/speech-cli-salts.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, wave, struct
          root = Path('/tmp/speech-cli-fixtures')
          model = root / 'fake-model.bin'
          model.write_bytes(b'MOCK_SIGNED_SPEECH_MODEL_ONLY')
          (root/'fake-model.sha256').write_text(hashlib.sha256(model.read_bytes()).hexdigest())
          samples = [16384] + [0]*639
          with wave.open(str(root/'s16-mono-16000.wav'), 'wb') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(16000)
              f.writeframes(struct.pack('<640h',*samples))
          with wave.open(str(root/'wrong-rate.wav'), 'wb') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(44100)
              f.writeframes(struct.pack('<640h',*samples))
          with wave.open(str(root/'wrong-channel.wav'), 'wb') as f:
              f.setnchannels(2); f.setsampwidth(2); f.setframerate(16000)
              f.writeframes(struct.pack('<640h',*samples))
          with wave.open(str(root/'partial-frame.wav'), 'wb') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(16000)
              f.writeframes(struct.pack('<639h',*samples[:-1]))
          (root/'bad.wav').write_bytes(b'NOT_A_WAVE')
          PY
      - name: Compare exact JFK spoken WAV and stationary noise power envelope without model bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/whisper-v195 rev-parse HEAD)" = d1be6fde11ac6e0407606b4e42fe72d34add8037
          test -f external/whisper-v195/samples/jfk.wav
          python3 speech_input/whisper/tools/generate_noise_fixtures.py \
            --output-dir "$MODEL_FIXTURES/stationarity-noise" \
            --report /tmp/speech-cli-stationary-fixtures-metadata.json
          python3 speech_input/whisper/tools/measure_frame_stationarity.py \
            --jfk-wav external/whisper-v195/samples/jfk.wav \
            --noise-dir "$MODEL_FIXTURES/stationarity-noise" \
            --report /tmp/speech-cli-stationarity-metrics.json
          # The report describes energy variation only, not accepted VAD.
          grep -Fq '"acoustic_vad_certified": false' /tmp/speech-cli-stationarity-metrics.json
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@0dc254695917bc180504d916240292e9096e9da5
        with:
          mode: read
      - name: Install CPU build utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build nasm pkg-config libspeexdsp-dev ffmpeg ffmpeg
      - name: Build real reviewed Whisper.cpp v1.9.5 CPU shared SDK
        shell: bash
        run: |
          set -euo pipefail
          cmake -S external/whisper-v195 -B build/whisper-cli-upstream -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_INSTALL_PREFIX=$TURBO_WHISPER_SDK_ROOT" \
            -DWHISPER_BUILD_IS_DEV=OFF -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_CURL=OFF -DWHISPER_COREML=OFF \
            -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF \
            -DGGML_METAL=OFF -DGGML_OPENMP=OFF \
            -DBUILD_SHARED_LIBS=ON
          cmake --build build/whisper-cli-upstream --parallel 2
          cmake --install build/whisper-cli-upstream
          test -f "$TURBO_WHISPER_SDK_ROOT/lib/cmake/whisper/whisper-config.cmake"
      - name: Build actual optional offline CLI linked to pinned Whisper CPU provider
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$TURBO_WHISPER_SDK_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/speech-cli/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          cmake -S speech_input -B build/speech-cli -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DENABLE_SPEECH_WHISPER=ON \
            -DENABLE_SPEECH_CAPTURE_BRIDGE=ON \
            -DENABLE_SPEECH_WHISPER_CLI=ON \
            "-DCMAKE_TOOLCHAIN_FILE=$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            "-DVCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed/speech-cli" \
            "-DCMAKE_C_FLAGS=-Wall -Wextra -Wpedantic -Werror" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/speech-cli --target turboagent-whisper-transcribe \
            --parallel 2
          test -f build/speech-cli/whisper/turboagent-whisper-transcribe
          # Model-free compile audit for the independent real-model DSO host.
          # It must not require a model, link Whisper or trigger any download.
          cmake --build build/speech-cli \
            --target test_turbo_agent_speech_whisper_real_model_dso --parallel 2
          host=build/speech-cli/whisper/test_turbo_agent_speech_whisper_real_model_dso
          test -x "$host"
          if ldd "$host" | grep -E 'lib(whisper|ggml)' ; then
            echo 'Independent C11 host must not link vendor inference libraries' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          commands=json.loads(Path('build/speech-cli/compile_commands.json').read_text())
          found=[r for r in commands if Path(r['file']).name=='test_speech_whisper_real_model_dso.c']
          assert len(found)==1 and '-Werror' in found[0]['command'], found
          print('PASS: real-model DSO host compiles as independent strict C11; zero model bytes')
          PY
          ldd build/speech-cli/whisper/turboagent-whisper-transcribe \
            | tee /tmp/speech-cli-real-dependencies.txt
          grep -F "$TURBO_WHISPER_SDK_ROOT/lib/libwhisper.so" \
            /tmp/speech-cli-real-dependencies.txt
          if grep -Fq 'not found' /tmp/speech-cli-real-dependencies.txt; then exit 1; fi
      - name: Reject malformed WAV, missing/wrong model SHA, unsupported format and implicit inputs
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$TURBO_WHISPER_SDK_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/speech-cli/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          cli="$GITHUB_WORKSPACE/build/speech-cli/whisper/turboagent-whisper-transcribe"
          wav="$MODEL_FIXTURES/s16-mono-16000.wav"
          model="$MODEL_FIXTURES/fake-model.bin"
          sha="$(cat "$MODEL_FIXTURES/fake-model.sha256")"
          require_failure() {
            local expected="$1"; shift
            set +e
            "$cli" "$@" > "$MODEL_FIXTURES/negative.stdout" 2> "$MODEL_FIXTURES/negative.stderr"
            local status=$?
            set -e
            test "$status" -eq "$expected"
            test ! -s "$MODEL_FIXTURES/negative.stdout"
          }
          require_failure 2
          require_failure 2 --model relative.bin --sha256 "$sha" --wav "$wav" --language en
          require_failure 2 --model "$model" --sha256 malformed --wav "$wav" --language en
          require_failure 3 --model "$model" --sha256 "$sha" --wav "$MODEL_FIXTURES/bad.wav" --language en
          require_failure 3 --model "$model" --sha256 "$sha" --wav "$MODEL_FIXTURES/wrong-rate.wav" --language en
          require_failure 3 --model "$model" --sha256 "$sha" --wav "$MODEL_FIXTURES/wrong-channel.wav" --language en
          require_failure 3 --model "$model" --sha256 "$sha" --wav "$MODEL_FIXTURES/partial-frame.wav" --language en
          require_failure 4 --model "$model" --sha256 "$sha" --wav "$wav" --language en
          printf '%s\n' 'PASS: real Whisper rejects invalid GGML model and all format/security negatives' \
            | tee /tmp/speech-cli-negative.txt
      - name: Build actual C11 CLI/PCM/Provider source against test-only pinned Whisper fake DSO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/speech-cli-mock-build
          cat > /tmp/speech-cli-mock-build/CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.25)
          project(WhisperOfflineCliMockC11 LANGUAGES C)
          set(CMAKE_C_STANDARD 11)
          set(CMAKE_C_STANDARD_REQUIRED ON)
          set(CMAKE_C_EXTENSIONS OFF)
          find_package(Salts CONFIG REQUIRED PATHS "$ENV{SALTS_ROOT}" NO_DEFAULT_PATH)
          add_library(fake_whisper_provider SHARED
            "$ENV{GITHUB_WORKSPACE}/speech_input/whisper/src/turbo_agent_speech_whisper.c"
            "$ENV{GITHUB_WORKSPACE}/speech_input/whisper/tests/whisper_fake_engine_image.c"
            "$ENV{GITHUB_WORKSPACE}/speech_input/src/turbo_agent_speech_input.c")
          set_target_properties(fake_whisper_provider PROPERTIES C_VISIBILITY_PRESET hidden)
          target_compile_definitions(fake_whisper_provider PRIVATE TURBO_AGENT_SPEECH_WHISPER_BUILD)
          target_include_directories(fake_whisper_provider PRIVATE
            "$ENV{GITHUB_WORKSPACE}/speech_input/include"
            "$ENV{GITHUB_WORKSPACE}/speech_input/whisper/include"
            "$ENV{GITHUB_WORKSPACE}/external/whisper-v195/include"
            "$ENV{GITHUB_WORKSPACE}/external/whisper-v195/ggml/include")
          target_link_libraries(fake_whisper_provider PRIVATE Salts::Core)
          target_link_options(fake_whisper_provider PRIVATE "LINKER:-z,defs")
          add_executable(mock_whisper_cli
            "$ENV{GITHUB_WORKSPACE}/speech_input/whisper/tools/turboagent_whisper_transcribe.c"
            "$ENV{GITHUB_WORKSPACE}/speech_input/capture/src/turbo_agent_speech_capture_bridge.c"
            "$ENV{GITHUB_WORKSPACE}/speech_input/src/turbo_agent_speech_input.c")
          target_include_directories(mock_whisper_cli PRIVATE
            "$ENV{GITHUB_WORKSPACE}/speech_input/include"
            "$ENV{GITHUB_WORKSPACE}/speech_input/capture/include"
            "$ENV{GITHUB_WORKSPACE}/speech_input/whisper/include")
          target_link_libraries(mock_whisper_cli PRIVATE fake_whisper_provider Salts::Core)
          CMAKE
          cmake -S /tmp/speech-cli-mock-build -B build/speech-cli-mock -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_C_FLAGS=-Wall -Wextra -Wpedantic -Werror" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/speech-cli-mock --parallel 2
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$GITHUB_WORKSPACE/build/speech-cli-mock:${LD_LIBRARY_PATH:-}"
          model="$MODEL_FIXTURES/fake-model.bin"
          sha="$(cat "$MODEL_FIXTURES/fake-model.sha256")"
          build/speech-cli-mock/mock_whisper_cli \
            --model "$model" --sha256 "$sha" \
            --wav "$MODEL_FIXTURES/s16-mono-16000.wav" --language en \
            --timeout-ms 30000 > /tmp/speech-cli-mock-positive.txt
          test "$(cat /tmp/speech-cli-mock-positive.txt)" = ' utterance'
          for adversarial in TA_SPEECH_TEST_ESCAPE TA_SPEECH_TEST_BIDI TA_SPEECH_TEST_C1 TA_SPEECH_TEST_ARABIC_MARK TA_SPEECH_TEST_LINE_SEPARATOR; do
            set +e
            env "$adversarial=1" build/speech-cli-mock/mock_whisper_cli \
              --model "$model" --sha256 "$sha" \
              --wav "$MODEL_FIXTURES/s16-mono-16000.wav" --language en \
              > "$MODEL_FIXTURES/unsafe.stdout" \
              2> "$MODEL_FIXTURES/unsafe.stderr"
            status=$?
            set -e
            test "$status" -eq 4
            test ! -s "$MODEL_FIXTURES/unsafe.stdout"
          done
          echo 'PASS: real C11 WAV/M2/M1/Provider pipeline and terminal/bidi injection refusal with deterministic fake acoustic engine'
      - name: Compare exact-source human PCM with real C11 Provider and fake-vendor inference
        if: github.event.pull_request.head.repo.full_name == 'qigao/TurboAgent' && github.event.pull_request.head.ref == 'test/speech-real-pcm-c11-parity-146'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$(mktemp -d "$RUNNER_TEMP/speech-c11-real-pcm-XXXXXX")"
          chmod 700 "$private"
          trap 'rm -rf -- "$private"' EXIT
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$GITHUB_WORKSPACE/build/speech-cli-mock"
          cli="$GITHUB_WORKSPACE/build/speech-cli-mock/mock_whisper_cli"
          test -x "$cli"
          model="$MODEL_FIXTURES/fake-model.bin"
          model_sha="$(cat "$MODEL_FIXTURES/fake-model.sha256")"
          ffmpeg_bin="$(realpath "$(command -v ffmpeg)")"
          ffmpeg_sha="$(sha256sum "$ffmpeg_bin" | awk '{print $1}')"

          # Exactly four pre-approved public original speech files, pinned
          # to both Wikimedia SHA-1 and previously observed full SHA-256.
          # No microphone, ASR model weights, raw transcript or audio upload.
          while IFS='|' read -r lang url bytes sha1 sha256 canonical_sha; do
            test -n "$lang" || continue
            source="$private/$lang-original.ogg"
            original_wav="$private/$lang-canonical.wav"
            derivative_wav="$private/$lang-derived-energy.wav"
            curl --fail --silent --show-error --location --retry 2 \
              --connect-timeout 15 --max-time 60 --max-filesize 500000 \
              --proto '=https' --proto-redir '=https' \
              --user-agent 'TurboAgent-real-PCM-C11-parity/1.0 (qigao/TurboAgent)' \
              "$url" --output "$source"
            test "$(wc -c < "$source" | tr -d '[:space:]')" = "$bytes"
            test "$(sha1sum "$source" | awk '{print $1}')" = "$sha1"
            test "$(sha256sum "$source" | awk '{print $1}')" = "$sha256"

            python3 speech_input/whisper/tools/prepare_stationarity_wav.py \
              --source "$source" --source-sha256 "$sha256" \
              --ffmpeg "$ffmpeg_bin" --ffmpeg-sha256 "$ffmpeg_sha" \
              --output-wav "$original_wav" \
              --private-provenance "$private/$lang-provenance.json" \
              --acknowledge-rights > "$private/$lang-preflight.json"
            test "$(sha256sum "$original_wav" | awk '{print $1}')" = "$canonical_sha"

            python3 - "$lang" "$original_wav" "$canonical_sha" "$derivative_wav" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import struct
          import sys
          import wave
          sys.path.insert(0, "speech_input/whisper/tools")
          from stress_stationarity_human import (
              evaluate_bytes, make_wav, FRAME, MAX_STRESS_FRAMES,
              MIN_STRESS_FRAMES, TARGET_FRAME_RMS,
          )
          from measure_frame_stationarity import inspect_wav_bytes

          language, input_name, source_sha, output_name = sys.argv[1:]
          source = Path(input_name).read_bytes()
          assert hashlib.sha256(source).hexdigest() == source_sha
          reference = evaluate_bytes(source, source_sha)
          assert reference["original_energy_hypothesis"] == "dynamic_or_unknown"
          assert reference["controlled_energy_equalization"]["guard_on_predecode_no_speech"]
          with wave.open(input_name, "rb") as wav:
              pcm = wav.readframes(wav.getnframes())
          values = struct.unpack("<%dh" % (len(pcm)//2), pcm)
          selected = []
          for frame in range(len(values)//FRAME):
              block = values[frame*FRAME:(frame+1)*FRAME]
              power = sum(int(v)*int(v) for v in block)
              if power:
                  selected.append((block, power))
              if len(selected) == MAX_STRESS_FRAMES:
                  break
          assert len(selected) >= MIN_STRESS_FRAMES
          derived = []
          for block, power in selected:
              multiplier = TARGET_FRAME_RMS / ((power/FRAME)**0.5)
              transformed = [round(sample * multiplier) for sample in block]
              assert all(-32768 <= v <= 32767 for v in transformed)
              derived.extend(transformed)
          raw = struct.pack("<%dh" % len(derived), *derived)
          wav_bytes = make_wav(raw)
          measured = inspect_wav_bytes(wav_bytes)
          assert measured["frame_count"] == len(selected)
          assert measured["stationarity_hypothesis"] == "stationary_candidate"
          assert (measured["frame_power_cv"] ==
                  reference["controlled_energy_equalization"]["frame_power_cv"])
          assert (measured["frame_power_max_min_ratio"] ==
                  reference["controlled_energy_equalization"]["frame_power_max_min_ratio"])
          fd = os.open(output_name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "wb") as destination:
              destination.write(wav_bytes)
          print(json.dumps({
              "language": language,
              "evidence": "source-derived_edited_energy_only_not_natural_human",
              "controlled_frames": len(selected),
              "equalized_cv": measured["frame_power_cv"],
              "equalized_ratio": measured["frame_power_max_min_ratio"],
              "exact_canonical_sha_match": True,
              "model_weights_used": False,
              "audio_artifact_uploaded": False,
          }, sort_keys=True))
          PY

            # The executable and production C11 M1/M2/Provider source are
            # real; only the Whisper inference engine is deterministic FAKE.
            # A FINAL implies the vendor stub was called. NO_SPEECH with
            # zero stdout means the guard prevented vendor decode.
            run_case() {
              local label="$1" wav="$2" flag="$3" expected="$4"
              local stdout="$private/$lang-$label.stdout"
              local stderr="$private/$lang-$label.stderr"
              "$cli" --model "$model" --sha256 "$model_sha" \
                --wav "$wav" --language "$decoder_lang" \
                --stationarity-guard "$flag" --threads 1 --timeout-ms 30000 \
                > "$stdout" 2> "$stderr"
              if [ "$expected" = FINAL ]; then
                test "$(cat "$stdout")" = ' utterance'
                ! grep -Fq 'NO_SPEECH' "$stderr"
              else
                test "$expected" = NO_SPEECH
                test ! -s "$stdout"
                grep -Fq 'NO_SPEECH (no transcript emitted)' "$stderr"
              fi
            }
            # The Commons whisper recording is English; the "whisper"
            # row label is a fixture identity, not a CLI language code.
            decoder_lang="$lang"
            if [ "$lang" = whisper ]; then decoder_lang=en; fi
            run_case original-off "$original_wav" 0 FINAL
            run_case original-on "$original_wav" 1 FINAL
            run_case derived-off "$derivative_wav" 0 FINAL
            run_case derived-on "$derivative_wav" 1 NO_SPEECH
            printf '{"language":"%s","engine":"strict_C11_Provider_with_test_only_fake_Whisper","original_off":"FINAL","original_on":"FINAL","derived_off":"FINAL","derived_on":"NO_SPEECH","human_FFR_measured":false,"model_weights_downloaded":false}\n' "$lang"
          done <<'PINNED_HUMAN_SOURCE'
          ja|https://upload.wikimedia.org/wikipedia/commons/b/b9/%E6%98%A5%E3%81%AF%E3%81%82%E3%81%91%E3%81%BC%E3%81%AE.ogg|264858|c7992ec2188ee94102f83e4eff22c4f9b9365d39|cad2f1545a3ac898362590ea636b8c09f1d77391b506790ae909e0e1ff1441f7|ccb16e8ea766bd2f4bf40ed09e5666ea6700edbd79343eb961fb13e9cafd6a03
          zh|https://upload.wikimedia.org/wikipedia/commons/8/8a/Mandarin_Chinese-%E5%8D%97%E5%9B%BD%E5%B1%B1%E6%B2%B3.ogg|156728|2fb567da2edd9fc18160769b1c803bd9d072c273|304f11fa91ec51b2a2b9e4c11424f9944c6bdf3ee909440923511a86b5585b22|f246dded9eb91796c515f21b37f8e41b3357bdef3f6fe19552568c12653f0421
          en|https://upload.wikimedia.org/wikipedia/commons/5/58/En-uk-Do_you_speak_English.ogg|21562|79b6f88e3db116fab8bc068cd523420406bef1c4|10829789c781d912ccbfdd9a4f5d4b3dbb2dac0a42af34610f7cf4497ad25deb|458ce0d1086ae8a5381ccc09878a630c016ebed42303a859e2030e2efbbe339e
          whisper|https://upload.wikimedia.org/wikipedia/commons/e/e8/Whispering-example.ogg|30283|cc3b98f93353cf6ed8bb453669987afe7dd748bd|bbdbe95dfe4742e27845c03fba3a8caf9f0f5ad65e34e512fd5609d155e6304e|c81cf6b75800daf1070d3001f094877581bc68100f3c64cb43638491f89988d0
          PINNED_HUMAN_SOURCE
          # By design this step creates no GitHub artifact. Its private
          # decoded/source/derivative PCM and vendor stub transcripts are
          # erased automatically by the exit trap.
      - name: Re-run PLOS voiced, whispered and adjusted-envelope PCM through native C11 Provider
        if: github.event.pull_request.head.repo.full_name == 'qigao/TurboAgent' && github.event.pull_request.head.ref == 'test/speech-paired-voiced-whispered-study-146'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$(mktemp -d "$RUNNER_TEMP/study-native-c11-XXXXXX")"
          chmod 700 "$private"
          trap 'rm -rf -- "$private"' EXIT
          export LD_LIBRARY_PATH="$SALTS_ROOT/lib:$GITHUB_WORKSPACE/build/speech-cli-mock"
          cli="$GITHUB_WORKSPACE/build/speech-cli-mock/mock_whisper_cli"
          model="$MODEL_FIXTURES/fake-model.bin"
          model_sha="$(cat "$MODEL_FIXTURES/fake-model.sha256")"
          decoder="$(realpath "$(command -v ffmpeg)")"
          decoder_sha="$(sha256sum "$decoder" | awk '{print $1}')"
          test -x "$cli"

          case_count=0
          while IFS='|' read -r stimulus url source_bytes source_sha1 source_sha256 wav_sha256; do
            test -n "$stimulus" || continue
            case_count=$((case_count + 1))
            source="$private/$stimulus.oga"
            wav="$private/$stimulus.wav"
            curl --fail --location --silent --show-error --retry 2 \
              --connect-timeout 15 --max-time 45 --max-filesize 80000 \
              --proto '=https' --proto-redir '=https' \
              --user-agent 'TurboAgent-PLOS-C11-paired-acoustics/1.0 (qigao/TurboAgent)' \
              "$url" --output "$source"
            test "$(wc -c < "$source" | tr -d '[:space:]')" = "$source_bytes"
            test "$(sha1sum "$source" | awk '{print $1}')" = "$source_sha1"
            test "$(sha256sum "$source" | awk '{print $1}')" = "$source_sha256"
            python3 speech_input/whisper/tools/prepare_stationarity_wav.py \
              --source "$source" --source-sha256 "$source_sha256" \
              --ffmpeg "$decoder" --ffmpeg-sha256 "$decoder_sha" \
              --output-wav "$wav" \
              --private-provenance "$private/$stimulus.evidence.json" \
              --acknowledge-rights > "$private/$stimulus.status.json"
            test "$(sha256sum "$wav" | awk '{print $1}')" = "$wav_sha256"

            STUDY_WAV="$wav" STUDY_ID="$stimulus" python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "speech_input/whisper/tools")
          from measure_frame_stationarity import inspect_wav_bytes
          raw = Path(os.environ["STUDY_WAV"]).read_bytes()
          metrics = inspect_wav_bytes(raw)
          assert metrics["frame_count"] == 76
          assert metrics["stationarity_hypothesis"] == "dynamic_or_unknown"
          print(json.dumps({
              "study": "Ruggles-Freyman-Oxenham-2014",
              "stimulus": os.environ["STUDY_ID"],
              "exact_canonical_wav_sha_verified": True,
              "predecode_guard_on_rejection": False,
              "frame_power_cv": metrics["frame_power_cv"],
              "frame_power_ratio": metrics["frame_power_max_min_ratio"],
              "paired_experimental_stimuli_not_independent_speakers": True,
          }, sort_keys=True))
          PY

            # Exactly the production C11 CLI→M2 Capture→M1 SpeechInput→
            # Whisper Provider C source, with the vendor inference engine
            # replaced by the deterministic, model-free " utterance" stub.
            # Both original and envelope-adjusted speech should reach it.
            for guard in 0 1; do
              stdout="$private/$stimulus-guard$guard.stdout"
              stderr="$private/$stimulus-guard$guard.stderr"
              "$cli" --model "$model" --sha256 "$model_sha" \
                --wav "$wav" --language en --stationarity-guard "$guard" \
                --threads 1 --timeout-ms 30000 \
                > "$stdout" 2> "$stderr"
              test "$(cat "$stdout")" = ' utterance'
              ! grep -Fq 'NO_SPEECH (no transcript emitted)' "$stderr"
            done
            printf '{"study":"Ruggles-Freyman-Oxenham-2014","stimulus":"%s","native_c11_guard_off":"FINAL","native_c11_guard_on":"FINAL","inference":"fake_vendor_only","source_sha256_pinned":true,"real_ASR_quality_measured":false,"no_audio_upload":true}\n' "$stimulus"
          done <<'STUDY_PINNED_ORIGINALS'
          voiced|https://upload.wikimedia.org/wikipedia/commons/9/93/Influence-of-Musical-Training-on-Understanding-Voiced-and-Whispered-Speech-in-Noise-pone.0086980.s001.oga|11157|7ea315ea7703f3a6370088cddb15732ce41b4973|8457f227ce1490cfb372b52636812a1fd8ea39d2f63f66018688fac1f25ad6c7|a93d68dc3bf61f413d219c9ff6e68b0a5e059f728e72bec7d1e34d809d6b2819
          whispered|https://upload.wikimedia.org/wikipedia/commons/2/25/Influence-of-Musical-Training-on-Understanding-Voiced-and-Whispered-Speech-in-Noise-pone.0086980.s002.oga|11722|a7a0bdcceaba58a3e5e8fafa68efa80c256dd09e|2f11c93a0100f6106dee8de19cb7098d4b178730966f12d82b236a9420549c34|808c58491a4aa89ce69356832602999daa64e9f2180be13843064aa5ad3f1ea2
          whispered_envelope_matched|https://upload.wikimedia.org/wikipedia/commons/2/29/Influence-of-Musical-Training-on-Understanding-Voiced-and-Whispered-Speech-in-Noise-pone.0086980.s003.oga|10991|ecd2002718660eb5943b7a94b814272ca4068367|2f9efe41064d5122871860237e904b8febce993e8496bb22990e7ef6f322068a|2c35f44a0eb1101c6d51c56bad75ce274ae167e8ef8b5db5c209d0fe5363a428
          STUDY_PINNED_ORIGINALS
          test "$case_count" = 3
          # No samples, model weights or fake transcripts in artifacts.
      - name: Execute SHA-pinned three-arm SpeexDSP source on real C11 Provider, fake inference only
        if: github.event.pull_request.head.repo.full_name == 'qigao/TurboAgent' && (github.event.pull_request.head.ref == 'test/speech-speexdsp-3arm-c11-native-167' || github.event.pull_request.head.ref == 'test/speech-speexdsp-multilingual-c11-167')
        shell: bash
        run: |
          set -euo pipefail
          # No model download; uses existing fake-vendor DSO built above.
          # All media, fake text, metrics remain private to runner temp.
          bash speech_input/noise_lab/tools/run_three_arm_native_c11_ci.sh
      - name: Compare recorded road-noise/whisper overlay and noise-only via real C11 Guard (FAKE vendor)
        if: github.event.pull_request.head.repo.full_name == 'qigao/TurboAgent' && github.event.pull_request.head.ref == 'test/speech-recorded-noise-native-guard-167'
        shell: bash
        run: |
          set -euo pipefail
          # This does not run the real ASR. It only checks that the
          # strict C11 capture/provider admits genuine speech, while
          # noise-only is measured separately with a fake inference engine.
          bash speech_input/noise_lab/tools/run_recorded_road_native_c11_ci.sh
      - name: Archive pinned source and unmodified stdout/dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speech-whisper-offline-wav-cli-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/speech-cli-salts.sha256
            /tmp/speech-cli-real-dependencies.txt
            /tmp/speech-cli-stationarity-metrics.json
            /tmp/speech-cli-stationary-fixtures-metadata.json
            /tmp/speech-cli-negative.txt
            /tmp/speech-cli-mock-positive.txt
            build/speech-cli/compile_commands.json
            build/speech-cli-mock/compile_commands.json
