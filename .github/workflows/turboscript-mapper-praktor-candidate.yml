name: TurboAgent PraktorTools candidate TurboScript Mapper owner (#129)

'on':
  pull_request:
    paths:
      - '.github/workflows/turboscript-mapper-praktor-candidate.yml'
      - 'praktor_tools/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: ta-praktor-mapper-owner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-candidate-consumer:
    if: >-
      github.repository == 'qigao/TurboAgent' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'test/turboscript-130-praktor-consumer' &&
        github.event.pull_request.head.repo.full_name == 'qigao/TurboAgent') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/test/turboscript-130-praktor-consumer'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      TURBOSCRIPT_CANDIDATE_RUN: "38527075336"
      TURBOSCRIPT_CANDIDATE_SOURCE: "2a526f9cc4f0bb62516497bf2b05b8b80b7a48c0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@0dc254695917bc180504d916240292e9096e9da5
        with:
          mode: read
      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@0dc254695917bc180504d916240292e9096e9da5
      - name: Prepare exact Linux native linker and SDK tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build nasm binutils unzip
      - name: Restore immutable published dependency SDK graph
        shell: bash
        run: bash cmake/ci/restore-native-sdk.sh linux-x64 1 1

      - name: Select separate candidate TurboScript SDK (never rewrite official release bytes)
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ta-turboscript-130-consumer"
          mkdir -p "$root/download" "$root/sdk"
          # This artifact is produced by the exact, independently validated
          # TurboScript source PR #130; it is NOT a published NuGet package.
          gh run download "$TURBOSCRIPT_CANDIDATE_RUN" \
            --repo qigao/TurboScript --name turboscript-sdk-linux-x64 \
            --dir "$root/download"
          archive="$root/download/turboscript-linux-x64.tar.gz"
          test -s "$archive"
          tar -xzf "$archive" -C "$root/sdk"
          candidate="$root/sdk/linux-x64"
          test -f "$candidate/lib/cmake/TurboScript/TurboScriptConfig.cmake"
          test -f "$candidate/turboscript-sdk-manifest.txt"
          grep -Fx "commit=$TURBOSCRIPT_CANDIDATE_SOURCE" \
            "$candidate/turboscript-sdk-manifest.txt"
          for pair in "salts_release=2.3.0-rc.16" \
                      "salts_utils_release=4.3.0-rc.11" \
                      "chttp_release=2.1.0-rc.6"; do
            grep -Fx "$pair" "$candidate/turboscript-sdk-manifest.txt"
          done
          mapper="$candidate/bin/plugins/mapper.so"
          test -f "$mapper"
          nm -D --undefined-only "$mapper" \
            | tee "$root/mapper-undefined-symbols.txt"
          if nm -D --undefined-only "$mapper" \
               | grep -Eq '[[:space:]]U[[:space:]]+hash_bytes(@|$)'; then
            echo 'Candidate Mapper still imports hidden Salts CSTL hash_bytes' >&2
            exit 1
          fi
          sha256sum "$archive" "$mapper" | tee "$root/candidate-sha256.txt"
          {
            echo "TURBOSCRIPT_ROOT=$candidate"
            echo "TURBOSCRIPT_CANDIDATE_PREFIX=$candidate"
          } >> "$GITHUB_ENV"
          {
            echo "turboagent_source=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "candidate_turboscript_source=$TURBOSCRIPT_CANDIDATE_SOURCE"
            echo "candidate_turboscript_run=$TURBOSCRIPT_CANDIDATE_RUN"
            echo "qualification=SOURCE_CANDIDATE_NOT_RELEASED_NUGET"
            echo "official_turboscript_3.0.10_binaries_unchanged=true"
          } | tee "$root/provenance.txt"

      - name: Configure exact candidate SDK in clean standalone prefix
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-linux-release
          grep -F "$TURBOSCRIPT_CANDIDATE_PREFIX" \
            build/ci-linux-release/CMakeCache.txt

      - name: Audit newly compiled TurboAgent DSO imports before executable link
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ta-turboscript-130-consumer"
          cmake --build --preset ci-linux-release --target praktor_tools agent_compiler
          echo '=== packaged native DSO definitions of hash_bytes ==='
          : > "$root/packaged-defined-hash-by-image.txt"
          while IFS= read -r -d '' lib; do
            if nm -D --defined-only "$lib" 2>/dev/null \
               | grep -E '[[:space:]][A-Za-z][[:space:]]+hash_bytes(@|$)' \
               > "$root/hash-defined-current.txt"; then
              printf 'DSO=%s\n' "$lib" | tee -a "$root/packaged-defined-hash-by-image.txt"
              cat "$root/hash-defined-current.txt" \
                | tee -a "$root/packaged-defined-hash-by-image.txt"
            fi
          done < <(find "$RUNNER_TEMP/turboagent-release-sdks" -type f -name '*.so*' -print0)
          echo '=== actual linker command: praktor_tools ==='
          ninja -C build/ci-linux-release -t commands praktor_tools \
            | grep -F -- '-o bin/libpraktor_tools.so' | tail -1 \
            | tee "$root/praktor-tools-actual-link.txt"
          echo '=== actual static archive ownership in resulting image ==='
          nm -a build/ci-linux-release/bin/libpraktor_tools.so \
            | grep -E 'hash_bytes|hash_map_raw_init' \
            | tee "$root/praktor-tools-complete-symbols.txt" || true
          echo '=== symbol visibility ==='
          readelf -Ws build/ci-linux-release/bin/libpraktor_tools.so \
            | grep -E 'hash_bytes|hash_map_raw_init' \
            | tee "$root/praktor-tools-hash-readelf.txt" || true
          echo '=== linked native library imports ==='
          readelf -d build/ci-linux-release/bin/libpraktor_tools.so \
            | grep -F NEEDED | tee "$root/praktor-tools-needed.txt" || true
          : > "$root/turboagent-built-dso-undefined-hash.txt"
          count=0
          for image in build/ci-linux-release/bin/*.so; do
            test -f "$image" || continue
            if nm -D --undefined-only "$image" \
               | grep -E '[[:space:]]U[[:space:]]+hash_bytes(@|$)' \
               > "$root/hash-symbol-current.txt"; then
              count=$((count+1))
              printf 'DSO=%s\n' "$image" | tee -a "$root/turboagent-built-dso-undefined-hash.txt"
              cat "$root/hash-symbol-current.txt" \
                | tee -a "$root/turboagent-built-dso-undefined-hash.txt"
              readelf -d "$image" > "$root/$(basename "$image").needed.txt"
              readelf -Ws "$image" > "$root/$(basename "$image").symbols.txt"
            fi
          done
          printf 'newly_built_DSO_unresolved_hash_bytes=%s\n' "$count" \
            | tee "$root/newly-built-image-summary.txt"
          # A source-built DSO borrowing hidden CSTL code is itself a
          # release blocker, even when an upstream Mapper has been fixed.
          test "$count" -eq 0

      - name: Link and execute real PraktorTools tests with candidate Mapper
        shell: bash
        run: |
          set -euo pipefail
          cmake --build --preset ci-linux-release \
            --target test_turbo_praktor_inline_plan test_turbo_praktor_tool_pack
          ctest --test-dir build/ci-linux-release \
            -R '^test_turbo_praktor_(inline_plan|tool_pack)$' \
            --no-tests=error --output-on-failure --timeout 120

      - name: Preserve executable link and candidate binary proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ta-turboscript-130-consumer"
          mkdir -p "$root"
          if test -f build/ci-linux-release/build.ninja; then
            ninja -C build/ci-linux-release -t commands \
              > "$root/all-native-link-commands.txt"
            grep -E '(test_turbo_praktor_inline_plan|test_turbo_praktor_tool_pack)' \
              "$root/all-native-link-commands.txt" > "$root/praktor-link-commands.txt" || true
          fi
          if test -d build/ci-linux-release/Testing; then
            cp -r build/ci-linux-release/Testing "$root/" || true
          fi

      - name: Upload candidate vs official SDK provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turboagent-praktor-turboscript-candidate-linux
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/ta-turboscript-130-consumer/
