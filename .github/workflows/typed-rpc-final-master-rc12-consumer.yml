name: TurboAgent current-main Typed RPC installed final-master canonical-Unicode rc.12 candidate and Provider DSO qualification (#647)

'on':
  pull_request:
    paths:
      - '.github/workflows/typed-rpc-canonical-rc12-consumer.yml'
      - 'agent/CMakeLists.txt'
      - 'agent/tests/rpc_generated/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  exact-rc12-package:
    if: >-
      github.repository == 'qigao/TurboAgent' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'test/typed-rpc-final-master-consumer-647' &&
        github.event.pull_request.head.repo.full_name == 'qigao/TurboAgent') ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/test/typed-rpc-final-master-consumer-647'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SRC_RC12_CI: '39730024784'
      SRC_RC12_SHA: 'e770eec06fee2a60d7960e29b8b83030f8c939b7'
      BUILD_ROOT: /tmp/ta-rc12-consumer
      PKG_ROOT: /tmp/ta-rc12-packages
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Exact reviewed TurboAgent typed RPC/Provider source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Restore pinned vcpkg cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@2e214ae44a3e3244eded5db6361194576356fc9e
        with:
          mode: read
      - name: Restore pinned re2c tools
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@2e214ae44a3e3244eded5db6361194576356fc9e
      - name: Native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build nasm pkg-config binutils unzip
          mkdir -p "$PKG_ROOT" "$BUILD_ROOT"
      - name: Require verified successful source CI and obtain its unmodified NuGet bytes
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/qigao/salts-utils/actions/runs/$SRC_RC12_CI" > "$PKG_ROOT/source-run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run=json.loads((Path(os.environ['PKG_ROOT'])/'source-run.json').read_text())
          expected={'head_sha':os.environ['SRC_RC12_SHA'],
                    'head_branch':'release/salts-utils-4.3-databind-rc12-final-master-647',
                    'event':'push','path':'.github/workflows/ci.yml',
                    'status':'completed','conclusion':'success'}
          for key,value in expected.items():
              if run.get(key)!=value:
                  raise SystemExit(f"Unqualified source CI {key}: expected {value}, got {run.get(key)}")
          PY
          mkdir -p "$PKG_ROOT/candidate-download" "$PKG_ROOT/candidate"
          gh run download "$SRC_RC12_CI" --repo qigao/salts-utils --name salts-utils-native-nuget --dir "$PKG_ROOT/candidate-download"
          archive="$PKG_ROOT/candidate-download/SaltsUtils.Native.4.3.0-rc.12.nupkg"
          test -s "$archive"
          sha256sum "$archive" | tee "$PKG_ROOT/candidate-nupkg.sha256"
          unzip -q "$archive" -d "$PKG_ROOT/candidate"
          python3 - <<'PY' | tee "$PKG_ROOT/candidate-package-audit.json"
          import json, os, zipfile
          from pathlib import Path
          archive=Path(os.environ['PKG_ROOT'])/'candidate-download/SaltsUtils.Native.4.3.0-rc.12.nupkg'
          rids={'linux-x64','linux-arm64','windows-x64','macos-arm64','android-arm64-v8a','ios-arm64'}
          with zipfile.ZipFile(archive) as z:
              files=set(z.namelist())
              expected={f'sdk/{rid}/salts-utils-sdk-manifest.txt' for rid in rids}
              found={f for f in files if f.endswith('/salts-utils-sdk-manifest.txt')}
              if found!=expected: raise SystemExit(f'Six-RID mismatch: {found ^ expected}')
              for path in expected:
                  data=dict(s.split('=',1) for s in z.read(path).decode('utf-8-sig').splitlines() if '=' in s)
                  rid=path.split('/')[1]
                  for k,v in {'version':'4.3.0-rc.12','commit':os.environ['SRC_RC12_SHA'],'profile':'release','rid':rid,'salts_version':'2.3.0-rc.17'}.items():
                      if data.get(k)!=v: raise SystemExit(f'{path}: {k}={data.get(k)!r}, expected {v!r}')
              for path in ('sdk/linux-x64/bin/salts-idlc',
                           'sdk/linux-x64/include/data_bind_native.h',
                           'sdk/linux-x64/include/data_bind_method_plan.h',
                           'sdk/linux-x64/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake'):
                  if path not in files: raise SystemExit(f'Missing {path}')
          print(json.dumps({'status':'PASS','version':'4.3.0-rc.12',
                            'source':os.environ['SRC_RC12_SHA'],
                            'rids':sorted(rids),'published':False},indent=2))
          PY
          candidate="$PKG_ROOT/candidate/sdk/linux-x64"
          chmod +x "$candidate/bin/salts-idlc"
          echo "SALTS_UTILS_ROOT=$candidate" >> "$GITHUB_ENV"
      - name: Restore exact official Salts rc.17 and CHttp rc.6 SDKs
        shell: bash
        run: |
          set -euo pipefail
          for kind in salts chttp; do
            if [ "$kind" = salts ]; then
              repo=qigao/salts; tag=v2.3.0-rc.17; file=Salts.Native.2.3.0-rc.17.nupkg
              expected_sha=6d6fd387cb245be8d7b0d866f9babad026a26832
            else
              repo=qigao/chttp; tag=v2.1.0-rc.6; file=CHttp.Native.2.1.0-rc.6.nupkg
              expected_sha=960c7cbca53084e03625cc0c8278f2cf815ce7b6
            fi
            actual_sha="$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha)"
            test "$actual_sha" = "$expected_sha"
            mkdir -p "$PKG_ROOT/$kind-download" "$PKG_ROOT/$kind"
            gh release download "$tag" --repo "$repo" --pattern "$file" --dir "$PKG_ROOT/$kind-download"
            test -s "$PKG_ROOT/$kind-download/$file"
            sha256sum "$PKG_ROOT/$kind-download/$file" | tee -a "$PKG_ROOT/official-packages.sha256"
            unzip -q "$PKG_ROOT/$kind-download/$file" -d "$PKG_ROOT/$kind"
          done
          salts="$PKG_ROOT/salts/sdk/linux-x64"
          chttp="$PKG_ROOT/chttp/sdk/linux-x64"
          test -f "$salts/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$chttp/lib/cmake/Chttp/ChttpConfig.cmake"
          echo "SALTS_ROOT=$salts" >> "$GITHUB_ENV"
          echo "CHTTP_ROOT=$chttp" >> "$GITHUB_ENV"
      - name: Real generated Typed RPC with unloadable Provider DSO against installed packages
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$CHTTP_ROOT/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib:${LD_LIBRARY_PATH:-}"
          cmake --preset ci-linux-release -B "$BUILD_ROOT" \
            -DCMAKE_PREFIX_PATH="$SALTS_ROOT;$SALTS_UTILS_ROOT;$CHTTP_ROOT" \
            -DSaltsUtils_IDLC_EXECUTABLE="$SALTS_UTILS_ROOT/bin/salts-idlc" \
            -DBUILD_TESTS=ON -DENABLE_WASM_TOOLS=OFF -DENABLE_PRAKTOR_TOOLS=OFF \
            -DENABLE_CODEX_BRIDGE=OFF -DENABLE_CODING_TOOLS=OFF -DENABLE_MCP_TOOLS=OFF
          cmake --build "$BUILD_ROOT" --target test_turboagent_typed_rpc --parallel 2
          test -f "$BUILD_ROOT/bin/test_turboagent_typed_rpc"
          test -f "$BUILD_ROOT/bin/libturboagent_rpc_provider_dso.so"
          ldd "$BUILD_ROOT/bin/test_turboagent_typed_rpc" | tee "$PKG_ROOT/typed-rpc.ldd.txt"
          grep -F "$SALTS_UTILS_ROOT/lib/libdata_bind.so" "$PKG_ROOT/typed-rpc.ldd.txt"
          grep -F "$CHTTP_ROOT/lib/libchttp_client.so" "$PKG_ROOT/typed-rpc.ldd.txt"
          if grep -Fq 'not found' "$PKG_ROOT/typed-rpc.ldd.txt"; then exit 1; fi
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Independent installed C11 and C++17 compile/link consumers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PKG_ROOT/smoke"
          cat > "$PKG_ROOT/smoke/c11.c" <<'C11'
          #include <data_bind_native.h>
          #include <data_bind_method_plan.h>
          int main(void) { return sizeof(DataBindNativeTypeBinding) == 0; }
          C11
          cat > "$PKG_ROOT/smoke/cxx17.cpp" <<'CPP'
          #include <data_bind_native.h>
          #include <data_bind_method_plan.h>
          #include <type_traits>
          static_assert(std::is_standard_layout<DataBindNativeTypeBinding>::value,
                        "Native ABI must retain C++17 standard layout");
          int main() { return sizeof(DataBindNativeTypeBinding) == 0; }
          CPP
          cat > "$PKG_ROOT/smoke/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.25)
          project(saltsutils_package_external_c11_cpp17 LANGUAGES C CXX)
          set(CMAKE_C_STANDARD 11)
          set(CMAKE_CXX_STANDARD 17)
          find_package(Salts CONFIG REQUIRED)
          find_package(SaltsUtils CONFIG REQUIRED)
          add_executable(consumer_c11 c11.c)
          add_executable(consumer_cpp17 cxx17.cpp)
          target_link_libraries(consumer_c11 PRIVATE Salts::DataBind)
          target_link_libraries(consumer_cpp17 PRIVATE Salts::DataBind)
          CMAKE
          cmake -S "$PKG_ROOT/smoke" -B "$PKG_ROOT/smoke-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_PREFIX_PATH="$SALTS_ROOT;$SALTS_UTILS_ROOT;$CHTTP_ROOT"
          cmake --build "$PKG_ROOT/smoke-build" --parallel 2
          "$PKG_ROOT/smoke-build/consumer_c11"
          "$PKG_ROOT/smoke-build/consumer_cpp17"
      - name: Ten real Typed RPC and Provider generation stop-cancel-drain-unload executions
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 850s \
            ctest --test-dir "$BUILD_ROOT" -R '^test_turboagent_typed_rpc$' \
            --repeat until-fail:10 --no-tests=error --timeout 120 --output-on-failure
      - name: Preserve release-candidate NuGet and actual runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turboagent-final-master-rc12-nupkg-consumer-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.PKG_ROOT }}/source-run.json
            ${{ env.PKG_ROOT }}/candidate-package-audit.json
            ${{ env.PKG_ROOT }}/candidate-nupkg.sha256
            ${{ env.PKG_ROOT }}/official-packages.sha256
            ${{ env.PKG_ROOT }}/typed-rpc.ldd.txt
            ${{ env.BUILD_ROOT }}/Testing/Temporary/LastTest.log
