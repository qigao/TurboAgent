name: CMake Unix preset pipeline
variables:
  PRESET: win-release-user
  TASK: all
  TARGET: ''
  TEST_REGEX: ''
  RUN_PROGRAM: ''
  RUN_ARGS: '[]'
  TEST: '1'
  INSTALL: '0'
  FRESH: '0'
  SALTS_ROOT: '{{ env.SALTS_ROOT }}'
  SALTS_UTILS_ROOT: '{{ env.SALTS_UTILS_ROOT }}'
  CHTTP_ROOT: '{{ env.CHTTP_ROOT }}'
  TURBOWASM_ROOT: '{{ env.TURBOWASM_ROOT }}'
  TURBOSCRIPT_ROOT: '{{ env.TURBOSCRIPT_ROOT }}'
  PRAKTOR_ROOT: '{{ env.PRAKTOR_ROOT }}'
  TURBOAGENT_HOST_IDLC: '{{ env.TURBOAGENT_HOST_IDLC }}'
  TURBOAGENT_HOST_SALTS_ROOT: '{{ env.TURBOAGENT_HOST_SALTS_ROOT }}'
env:
  SALTS_ROOT: '{{ SALTS_ROOT }}'
  SALTS_UTILS_ROOT: '{{ SALTS_UTILS_ROOT }}'
  CHTTP_ROOT: '{{ CHTTP_ROOT }}'
  TURBOWASM_ROOT: '{{ TURBOWASM_ROOT }}'
  TURBOSCRIPT_ROOT: '{{ TURBOSCRIPT_ROOT }}'
  PRAKTOR_ROOT: '{{ PRAKTOR_ROOT }}'
  TURBOAGENT_HOST_IDLC: '{{ TURBOAGENT_HOST_IDLC }}'
  TURBOAGENT_HOST_SALTS_ROOT: '{{ TURBOAGENT_HOST_SALTS_ROOT }}'
tasks:
  - name: configure
    when: "($TASK == 'all' || $TASK == 'configure' || $TASK == 'build' || $TASK == 'test' || $TASK == 'install' || $TASK == 'run') && $FRESH == '0'"
    program: cmake
    args: ['--preset', '{{ PRESET }}']
    working_dir: ../..
    timeout: 90m

  - name: configure-fresh
    when: "$TASK == 'refresh' || (($TASK == 'all' || $TASK == 'configure' || $TASK == 'build' || $TASK == 'test' || $TASK == 'install' || $TASK == 'run') && $FRESH == '1')"
    program: cmake
    args: ['--fresh', '--preset', '{{ PRESET }}']
    working_dir: ../..
    timeout: 90m

  - name: build
    depends_on: [configure, configure-fresh]
    when: "($TASK == 'all' || $TASK == 'build' || $TASK == 'test' || $TASK == 'install' || $TASK == 'run') && $TARGET == ''"
    program: cmake
    args: ['--build', '--preset', '{{ PRESET }}']
    working_dir: ../..
    timeout: 90m

  - name: build-target
    depends_on: [configure, configure-fresh]
    when: "($TASK == 'all' || $TASK == 'build' || $TASK == 'test' || $TASK == 'run') && $TARGET != ''"
    program: cmake
    args: ['-DLOCAL_ACTION=build', '-P', cmake/RunLocal.cmake]
    env:
      TURBOAGENT_LOCAL_PRESET: '{{ PRESET }}'
      TURBOAGENT_LOCAL_TARGET: '{{ TARGET }}'
    working_dir: ../..
    timeout: 90m

  - name: test
    depends_on: [build, build-target]
    when: "($TASK == 'test' || (($TASK == 'all' || $TASK == 'install') && $TEST == '1')) && $TEST_REGEX == ''"
    program: ctest
    args: ['--preset', '{{ PRESET }}', '--output-on-failure']
    working_dir: ../..
    timeout: 30m

  - name: test-selected
    depends_on: [build, build-target]
    when: "($TASK == 'test' || (($TASK == 'all' || $TASK == 'install') && $TEST == '1')) && $TEST_REGEX != ''"
    program: cmake
    args: ['-DLOCAL_ACTION=test', '-P', cmake/RunLocal.cmake]
    env:
      TURBOAGENT_LOCAL_PRESET: '{{ PRESET }}'
      TURBOAGENT_LOCAL_TEST_REGEX: '{{ TEST_REGEX }}'
    working_dir: ../..
    timeout: 30m

  - name: run
    depends_on: [build, build-target]
    when: "$TASK == 'run'"
    program: cmake
    args: ['--build', '--preset', '{{ PRESET }}', '--target', run-program]
    env:
      TURBOAGENT_RUN_PROGRAM: '{{ RUN_PROGRAM }}'
      TURBOAGENT_RUN_ARGS: '{{ RUN_ARGS }}'
    working_dir: ../..
    timeout: 30m

  - name: install
    depends_on: [test, test-selected]
    when: "$TASK == 'install' || ($TASK == 'all' && $INSTALL == '1')"
    program: cmake
    args: ['--build', '--preset', 'install-{{ PRESET }}']
    working_dir: ../..
    timeout: 30m
